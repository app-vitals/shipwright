title = "Agent gitleaks configuration"

# Extend the default ruleset; the allowlist below is applied on top.
[extend]
useDefault = true

[allowlist]
description = "Known-safe test fixtures"
paths = [
    # Fake PEM stubs and placeholder app credentials in provisioning tests.
    '''admin/src/admin-local-agent\.smoke\.test\.ts''',
    '''admin/src/admin-ui\.smoke\.test\.ts''',
    # RFC 8291 spec test vectors + synthetic P-256 VAPID keypairs generated
    # solely for unit tests — not real credentials.
    '''admin/src/push-crypto\.unit\.test\.ts''',
    '''admin/src/push-sender\.unit\.test\.ts''',
    '''admin/src/push-service\.unit\.test\.ts''',
]
