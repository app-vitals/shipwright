name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the next version and changelog without publishing tags or commits"
        type: boolean
        required: false
        default: false

# Least privilege at the workflow level; the release job uses a scoped GitHub
# App token for everything that writes.
permissions:
  contents: read

jobs:
  guard:
    name: Admin check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Assert actor is admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          PERMISSION=$(gh api repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission --jq '.permission')
          if [ "$PERMISSION" != "admin" ]; then
            echo "Error: $ACTOR is not a repo admin (got: $PERMISSION)" >&2
            exit 1
          fi

  release:
    name: semantic-release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped to what semantic-release needs: release commits and GitHub
          # releases (contents), comments on referenced issues/PRs.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release (dry run)
        if: ${{ inputs.dry_run }}
        run: bunx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Release
        if: ${{ !inputs.dry_run }}
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
