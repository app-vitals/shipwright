name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo (checkout, build, test,
# docker build). None pushes, opens PRs or publishes packages.
permissions:
  contents: read

jobs:
  ci:
    name: lint / typecheck / boundary / test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_ADMIN_TEST: postgres://agent:agent@localhost:5432/agent_admin_test
      DATABASE_URL_SHIPWRIGHT_ADMIN: postgres://agent:agent@localhost:5432/agent_admin_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not floating: Bun 1.4.0 changed `process.env.KEY = undefined`
          # to coerce to the string "undefined" instead of deleting the key.
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Port of the monorepo's platform gate: no import may leave runtime/,
      # admin/, lib/ and agent-types/.
      - name: Import-boundary gate
        run: bun run check:boundary

      - name: Sync test DB schema
        run: cd admin && bunx prisma migrate deploy --schema=prisma/schema

      - name: Install Playwright chromium-headless-shell
        run: bunx playwright install --with-deps chromium-headless-shell

      - name: Test
        run: bun test

  admin-docker-build:
    name: admin docker build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build admin Docker image
        run: docker build -f admin/Dockerfile -t agent-admin:ci .

  runtime-docker-build:
    name: runtime docker build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile's module-resolution guard (bun build over every runtime
      # source file) runs inside this build.
      - name: Build runtime Docker image
        run: docker build -f runtime/Dockerfile -t agent:ci .

      # Load-bearing: a green `bun test` in CI's unrestricted process does not
      # prove Chromium launches under a restricted securityContext (non-root,
      # no privilege escalation). The image's ENTRYPOINT is exec-form, so
      # --entrypoint overrides it to run the verify script.
      - name: Verify browser launch under sandbox restrictions
        run: |
          docker run --rm --user 1000 --security-opt=no-new-privileges \
            --entrypoint bun agent:ci \
            run scripts/verify-browser-launch.ts

      # Base-image contract smoke: builds a derived image FROM the image above
      # the way downstream repos do and asserts that a marketplace COPYed to
      # /opt/shipwright/marketplaces/ registers via installPlugins() and that
      # the entrypoint path runs under `bun run`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Base-image contract smoke test
        run: SHIPWRIGHT_CONTRACT_BASE_IMAGE=agent:ci bun test runtime/base-image-contract.smoke.test.ts
