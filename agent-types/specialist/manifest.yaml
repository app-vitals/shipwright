# agent-types/specialist/manifest.yaml
#
# AgentType manifest for the "specialist" agent type — a generic, non-coding
# agent. Unlike "coding" it ships no system crons, no bundled shipwright
# plugin, and no GitHub/task-store scope by default; specialties layer their
# own plugins, crons and env on top via the admin API after creation.
#
# Validated against admin/src/agent-type-registry.ts's AgentTypeManifestSchema
# (see agent-types/specialist/manifest.content.test.ts).
#
# NOTE: identity.templatesDir is read by the agent runtime when seeding a new
# workspace. It points at the specialist template set (CLAUDE.md, SOUL.md,
# IDENTITY.md and an optional SPECIALTY.md, all *.template) with no
# coding-only sections; files it omits fall back to agent/workspace/.
apiVersion: shipwright.dev/v1alpha1
kind: AgentType
metadata:
  name: specialist
  displayName: Specialist Agent
  description: >-
    A generic, non-coding agent that starts with no system crons, no
    shipwright plugin and no GitHub scope, to be specialized with its own
    plugins, crons and env after creation.
  version: 1.0.0
  skills: []
identity:
  templatesDir: agent-types/specialist/templates/
crons: []
plugins: []
tools:
  - Bash
  - WebSearch
  - WebFetch
  - Agent
env:
  required:
    - key: CLAUDE_CODE_OAUTH_TOKEN
      description: >-
        Claude Code OAuth token used to authenticate the agent's Claude
        sessions (alternative to ANTHROPIC_API_KEY).
      secret: true
  optional:
    - key: GH_TOKEN
      description: >-
        GitHub Personal Access Token, used as a fallback for GitHub API
        access when GitHub App credentials are not configured.
      secret: true
    - key: SLACK_BOT_TOKEN
      description: Slack bot user OAuth token, required for chat over Slack.
      secret: true
    - key: SLACK_APP_TOKEN
      description: Slack app-level token for Socket Mode, required for chat over Slack.
      secret: true
    - key: SLACK_SIGNING_SECRET
      description: Used to verify incoming Slack request signatures.
      secret: true
    - key: GROQ_API_KEY
      description: Groq API key for voice transcription/processing.
      secret: true
    - key: ELEVENLABS_API_KEY
      description: ElevenLabs API key for voice speech synthesis.
      secret: true
    - key: ELEVENLABS_VOICE_ID
      description: ElevenLabs voice ID to use for speech synthesis.
      secret: false
    - key: WHISPER_SERVICE_URL
      description: URL of a Whisper transcription service for voice input.
      secret: false
    - key: PIPER_VOICE
      description: >-
        Piper voice name to use for local (offline) speech synthesis when
        no cloud voice provider is configured.
      secret: false
members: []
repos: []
chat: true
voice: true
