# chart-testing (ct) configuration.
# https://github.com/helm/chart-testing
#
# Single-chart repo: charts live under charts/, the only chart is
# charts/shipwright. ct discovers the per-environment values variants under
# charts/shipwright/ci/*-values.yaml and installs the chart once per variant on
# the kind cluster, then runs `helm test`.

# Branch ct diffs against to decide which charts changed.
target-branch: main

# Where charts live (relative to repo root).
chart-dirs:
  - charts

# This is a leaf application chart; no remote chart repositories to add.
chart-repos: []

# Single maintainer/org chart — don't enforce the maintainers list.
validate-maintainers: false

# No chart-version-bump gate: the chart version is derived at publish time by
# chart-release.yml (ADR 0001), so source edits do not bump Chart.yaml `version`
# (a MAJOR.MINOR floor). See the chart README "Versioning" section.
check-version-increment: false

# Extra args passed to every `helm install`/`helm upgrade` ct runs. The
# bundled optional subcharts (CNH-6.1) — especially cert-manager with
# startupapicheck.enabled: true, which waits on a post-install Job — can take
# longer than Helm's default install timeout (5m) on CI's kind cluster.
helm-extra-args: --timeout 600s
