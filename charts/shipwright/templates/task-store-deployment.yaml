{{- if .Values.taskStore.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shipwright.taskStore.fullname" . }}
  labels:
    {{- include "shipwright.taskStore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.taskStore.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "shipwright.taskStore.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shipwright.taskStore.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shipwright.taskStore.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if include "shipwright.taskStore.useBundledDatabase" . }}
      # Only on the bundled-PostgreSQL path — an external database is the
      # operator's to make reachable, and blocking on it here would be wrong.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "shipwright.postgresql.fullname" . }} 5432; do echo "waiting for postgresql..."; sleep 2; done']
      {{- end }}
      containers:
        - name: task-store
          image: {{ include "shipwright.imageRef" (dict "context" $ "repository" .Values.taskStore.image.repository "tag" (.Values.taskStore.image.tag | default .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.taskStore.image.pullPolicy | default .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # DB-aware — keeps the pod out of Service rotation until Postgres
            # is actually reachable (mirrors admin's /health/ready split).
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 2
          env:
            {{- if .Values.taskStore.database.existingSecret }}
            # Bring-your-own Secret (the default, "shipwright-secrets"). The chart
            # neither creates nor owns it — create it before deploying.
            - name: DATABASE_URL_SHIPWRIGHT_TASK_STORE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskStore.database.existingSecret }}
                  key: DATABASE_URL_SHIPWRIGHT_TASK_STORE
            {{- else if .Values.postgresql.enabled }}
            # Chart-managed bundled-PostgreSQL path: the DSN is assembled in
            # task-store-secret.yaml so the password stays out of plaintext env.
            - name: DATABASE_URL_SHIPWRIGHT_TASK_STORE
              valueFrom:
                secretKeyRef:
                  name: {{ include "shipwright.taskStore.secretName" . }}
                  key: DATABASE_URL_SHIPWRIGHT_TASK_STORE
            {{- else }}
            {{- fail "taskStore.database.existingSecret is required when postgresql.enabled=false" }}
            {{- end }}
            {{- if .Values.taskStore.sentry.dsn.existingSecret }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskStore.sentry.dsn.existingSecret }}
                  key: {{ .Values.taskStore.sentry.dsn.key | default "SENTRY_DSN" }}
            {{- end }}
            {{- if .Values.taskStore.sentry.environment }}
            - name: SENTRY_ENVIRONMENT
              value: {{ .Values.taskStore.sentry.environment | quote }}
            {{- end }}
            {{- with .Values.taskStore.extraEnv }}
            # taskStore.extraEnv: caller-supplied env vars appended last so they can
            # override anything above if needed.
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.taskStore.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.cloudSqlProxy.image }}
          args:
            - --private-ip
            - {{ required "cloudSqlProxy.connectionName is required when cloudSqlProxy.enabled=true" .Values.cloudSqlProxy.connectionName | quote }}
            {{- range .Values.cloudSqlProxy.args }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            runAsNonRoot: true
          {{- with .Values.cloudSqlProxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
{{- end }}