{{- if and .Values.taskStore.enabled (include "shipwright.taskStore.useBundledDatabase" .) }}
{{- /*
  Chart-managed task-store Secret — the bundled-PostgreSQL path only.

  Rendered ONLY when taskStore.database.existingSecret is empty AND the bundled
  PostgreSQL subchart is enabled. That value defaults to the non-empty
  "shipwright-secrets", so no existing install renders this Secret and the
  bring-your-own-Secret path is completely untouched; opting in is an explicit
  `taskStore.database.existingSecret: ""`.

  Holds the fully-assembled DATABASE_URL_SHIPWRIGHT_TASK_STORE so the Postgres
  password never appears in the Deployment's plaintext env — the same idiom as
  admin-secret.yaml and metrics-secret.yaml. The target database is SEPARATE from
  admin/metrics/chat (see shipwright.taskStore.databaseName) and is provisioned by
  postgres-initdb-configmap.yaml on a fresh volume, or by
  postgres-db-bootstrap-job.yaml on an existing one.

  No lookup-persistence idiom here: unlike the session/encryption keys, nothing in
  this Secret is randomly generated — the DSN is derived deterministically from
  values, so it is stable across upgrades by construction.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shipwright.taskStore.secretName" . }}
  labels:
    {{- include "shipwright.taskStore.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $dbUrl := include "shipwright.postgresql.dsn" (dict "context" . "database" (include "shipwright.taskStore.databaseName" .)) }}
  DATABASE_URL_SHIPWRIGHT_TASK_STORE: {{ $dbUrl | b64enc | quote }}
{{- end }}
