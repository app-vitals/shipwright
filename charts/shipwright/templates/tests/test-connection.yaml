{{- if .Values.admin.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "shipwright.fullname" . }}-test-connection
  labels:
    {{- include "shipwright.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-connection
  annotations:
    # Marks this Pod as a Helm test hook: it only runs on `helm test`, never on
    # install/upgrade. Deleted after the test run unless it fails (kept for debug).
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # A failed test Pod should surface immediately, not be retried into a
  # CrashLoopBackOff that masks the failure from `helm test`.
  restartPolicy: Never
  containers:
    - name: curl
      # Small, public, pinned curl image (no first-party build needed).
      image: curlimages/curl:8.11.1
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          # Admin /health MUST return 200.
          ADMIN_URL="http://{{ include "shipwright.admin.fullname" . }}:{{ .Values.admin.service.port }}/health"
          echo "GET ${ADMIN_URL} (expect 200)"
          admin_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused "${ADMIN_URL}")"
          echo "admin /health -> ${admin_code}"
          if [ "${admin_code}" != "200" ]; then
            echo "FAIL: admin /health returned ${admin_code}, expected 200" >&2
            exit 1
          fi
          {{- if .Values.metrics.enabled }}
          # Metrics dashboard route MUST return 200 or 302 (auth/redirect
          # tolerated). The app mounts its whole router under
          # metrics.provider.basePath (METRICS_BASE_PATH) when set, so the
          # dashboard route lives at "${basePath}/dashboard", not the bare
          # "/dashboard" — same prefixing as the liveness/readiness probes.
          METRICS_URL="http://{{ include "shipwright.metrics.fullname" . }}:{{ .Values.metrics.service.port }}{{ .Values.metrics.provider.basePath }}/dashboard"
          echo "GET ${METRICS_URL} (expect 200 or 302)"
          metrics_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused "${METRICS_URL}")"
          echo "metrics /dashboard -> ${metrics_code}"
          if [ "${metrics_code}" != "200" ] && [ "${metrics_code}" != "302" ]; then
            echo "FAIL: metrics /dashboard returned ${metrics_code}, expected 200 or 302" >&2
            exit 1
          fi
          {{- end }}
          {{- if .Values.taskStore.enabled }}
          # Task-store /health MUST return 200. This is the check that actually
          # proves the chart-managed database wiring worked: the service runs
          # `prisma migrate deploy` as a boot preflight and refuses to serve if
          # its database is missing or unmigrated.
          TASK_STORE_URL="http://{{ include "shipwright.taskStore.fullname" . }}:{{ .Values.taskStore.service.port }}/health"
          echo "GET ${TASK_STORE_URL} (expect 200)"
          task_store_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused "${TASK_STORE_URL}")"
          echo "task-store /health -> ${task_store_code}"
          if [ "${task_store_code}" != "200" ]; then
            echo "FAIL: task-store /health returned ${task_store_code}, expected 200" >&2
            exit 1
          fi
          {{- end }}
          {{- if .Values.chat.enabled }}
          # Chat /health MUST return 200 — same migrate-on-boot reasoning.
          CHAT_URL="http://{{ include "shipwright.chat.fullname" . }}:{{ .Values.chat.service.port }}/health"
          echo "GET ${CHAT_URL} (expect 200)"
          chat_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused "${CHAT_URL}")"
          echo "chat /health -> ${chat_code}"
          if [ "${chat_code}" != "200" ]; then
            echo "FAIL: chat /health returned ${chat_code}, expected 200" >&2
            exit 1
          fi
          {{- end }}
          {{- if index .Values "ingress-nginx" "enabled" }}
          # CNH-8.1: prove the cloud-native nginx+cert-manager profile actually
          # terminates real TLS through the BUNDLED ingress-nginx controller's
          # Service (not the task-store Service directly) — the whole point of
          # bundling ingress-nginx + cert-manager together is that traffic goes
          # in via the controller and comes out the other side with a
          # cert-manager-issued certificate, not ingress-nginx's own built-in
          # "Kubernetes Ingress Controller Fake Certificate" placeholder (which
          # it serves for any Host with no matching TLS-enabled Ingress).
          NGINX_CONTROLLER_SVC="{{ .Release.Name }}-ingress-nginx-controller"
          NGINX_HOST="{{ .Values.networking.ingress.host }}"
          NGINX_URL="https://${NGINX_HOST}/task-store/health"
          # --connect-to redirects the TCP connection to the controller Service
          # (in-cluster DNS name, no IP lookup needed) while keeping the
          # original host in the URL/SNI/Host header — so both TLS SNI routing
          # and cert-manager's ingress-shim host matching see the real host.
          echo "GET ${NGINX_URL} via bundled ingress-nginx controller Service ${NGINX_CONTROLLER_SVC} (expect 200)"
          # -k: the Issuer here is selfsigned (CI) or otherwise not a public CA
          # this curl image trusts, so we can't verify the chain — but we can
          # (and do) verify the SERVED certificate is not the nginx-default
          # fake one by inspecting -v's TLS handshake trace below.
          nginx_verbose="$(curl -sv -k -o /dev/null \
            --connect-to "${NGINX_HOST}:443:${NGINX_CONTROLLER_SVC}:443" \
            --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused --retry-all-errors -f \
            "${NGINX_URL}" 2>&1)"
          echo "${nginx_verbose}" | grep -E 'subject:|issuer:' || true
          if echo "${nginx_verbose}" | grep -qi 'Kubernetes Ingress Controller Fake Certificate'; then
            echo "FAIL: served certificate is ingress-nginx's default placeholder (Kubernetes Ingress Controller Fake Certificate), not a cert-manager-issued cert" >&2
            echo "${nginx_verbose}" >&2
            exit 1
          fi
          nginx_code="$(curl -s -k -o /dev/null -w '%{http_code}' \
            --connect-to "${NGINX_HOST}:443:${NGINX_CONTROLLER_SVC}:443" \
            --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused --retry-all-errors -f \
            "${NGINX_URL}")"
          echo "ingress-nginx -> task-store /task-store/health -> ${nginx_code}"
          if [ "${nginx_code}" != "200" ]; then
            echo "FAIL: task-store /task-store/health via ingress-nginx returned ${nginx_code}, expected 200" >&2
            exit 1
          fi
          {{- end }}
          {{- if .Values.traefik.enabled }}
          # CNH-8.1: prove the cloud-native traefik profile actually routes
          # through the BUNDLED traefik controller's Service (plain HTTP —
          # this profile bundles no cert-manager). Uses a Host header rather
          # than DNS/--resolve so it works regardless of whether the
          # controller Service has an external IP.
          TRAEFIK_SVC="{{ .Release.Name }}-traefik"
          TRAEFIK_HOST="{{ .Values.networking.ingress.host }}"
          TRAEFIK_URL="http://${TRAEFIK_SVC}/task-store/health"
          echo "GET ${TRAEFIK_URL} with Host: ${TRAEFIK_HOST} via bundled traefik Service (expect 200)"
          traefik_code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Host: ${TRAEFIK_HOST}" \
            --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused --retry-all-errors -f \
            "${TRAEFIK_URL}")"
          echo "traefik -> task-store /task-store/health -> ${traefik_code}"
          if [ "${traefik_code}" != "200" ]; then
            echo "FAIL: task-store /task-store/health via traefik returned ${traefik_code}, expected 200" >&2
            exit 1
          fi
          {{- end }}
          echo "OK: connection checks passed"
{{- end }}
