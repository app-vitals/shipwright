{{- if .Values.admin.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "shipwright.fullname" . }}-test-connection
  labels:
    {{- include "shipwright.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-connection
  annotations:
    # Marks this Pod as a Helm test hook: it only runs on `helm test`, never on
    # install/upgrade. Deleted after the test run unless it fails (kept for debug).
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # A failed test Pod should surface immediately, not be retried into a
  # CrashLoopBackOff that masks the failure from `helm test`.
  restartPolicy: Never
  containers:
    - name: curl
      # Small, public, pinned curl image (no first-party build needed).
      image: curlimages/curl:8.11.1
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          # Admin /health MUST return 200.
          ADMIN_URL="http://{{ include "shipwright.admin.fullname" . }}:{{ .Values.admin.service.port }}/health"
          echo "GET ${ADMIN_URL} (expect 200)"
          admin_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused "${ADMIN_URL}")"
          echo "admin /health -> ${admin_code}"
          if [ "${admin_code}" != "200" ]; then
            echo "FAIL: admin /health returned ${admin_code}, expected 200" >&2
            exit 1
          fi
          {{- if .Values.metrics.enabled }}
          # Metrics dashboard route MUST return 200 or 302 (auth/redirect
          # tolerated). The app mounts its whole router under
          # metrics.provider.basePath (METRICS_BASE_PATH) when set, so the
          # dashboard route lives at "${basePath}/dashboard", not the bare
          # "/dashboard" — same prefixing as the liveness/readiness probes.
          METRICS_URL="http://{{ include "shipwright.metrics.fullname" . }}:{{ .Values.metrics.service.port }}{{ .Values.metrics.provider.basePath }}/dashboard"
          echo "GET ${METRICS_URL} (expect 200 or 302)"
          metrics_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused "${METRICS_URL}")"
          echo "metrics /dashboard -> ${metrics_code}"
          if [ "${metrics_code}" != "200" ] && [ "${metrics_code}" != "302" ]; then
            echo "FAIL: metrics /dashboard returned ${metrics_code}, expected 200 or 302" >&2
            exit 1
          fi
          {{- end }}
          {{- if .Values.taskStore.enabled }}
          # Task-store /health MUST return 200. This is the check that actually
          # proves the chart-managed database wiring worked: the service runs
          # `prisma migrate deploy` as a boot preflight and refuses to serve if
          # its database is missing or unmigrated.
          TASK_STORE_URL="http://{{ include "shipwright.taskStore.fullname" . }}:{{ .Values.taskStore.service.port }}/health"
          echo "GET ${TASK_STORE_URL} (expect 200)"
          task_store_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused "${TASK_STORE_URL}")"
          echo "task-store /health -> ${task_store_code}"
          if [ "${task_store_code}" != "200" ]; then
            echo "FAIL: task-store /health returned ${task_store_code}, expected 200" >&2
            exit 1
          fi
          {{- end }}
          {{- if .Values.chat.enabled }}
          # Chat /health MUST return 200 — same migrate-on-boot reasoning.
          CHAT_URL="http://{{ include "shipwright.chat.fullname" . }}:{{ .Values.chat.service.port }}/health"
          echo "GET ${CHAT_URL} (expect 200)"
          chat_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused "${CHAT_URL}")"
          echo "chat /health -> ${chat_code}"
          if [ "${chat_code}" != "200" ]; then
            echo "FAIL: chat /health returned ${chat_code}, expected 200" >&2
            exit 1
          fi
          {{- end }}
          echo "OK: connection checks passed"
{{- end }}
