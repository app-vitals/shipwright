suite: admin pod service account feature flag
templates:
  - templates/admin-deployment.yaml
release:
  name: r
tests:
  - it: renders no pod service account env by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_POD_SERVICE_ACCOUNT_ENABLED
            value: "enabled"

  - it: renders pod service account env when enabled
    set:
      admin.podServiceAccount.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_POD_SERVICE_ACCOUNT_ENABLED
            value: "enabled"
