suite: agent voice (STT/TTS) — admin env (CV-1.1)
# Asserts the admin Deployment's agent.voice env, gated on agent.voice.enabled.
# The Whisper pod/Service and voice Secret suites moved to the agent-platform
# library chart with their templates (CHM-2.5); this chart's stubs are covered by
# render parity (scripts/chart-render-parity.ts).
release:
  name: r
  namespace: shipwright
tests:
  # ── (a) disabled (default) → no voice env ──────────────────
  - it: leaves the admin Deployment with no voice env by default
    template: templates/admin-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WHISPER_SERVICE_URL
            value: http://r-shipwright-whisper:9000
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ELEVENLABS_API_KEY
            valueFrom:
              secretKeyRef:
                name: r-shipwright-voice
                key: ELEVENLABS_API_KEY

  # ── (b) enabled + provider=whisper → admin env ─────
  - it: injects WHISPER_SERVICE_URL + the ElevenLabs vars into the admin Deployment when provider=whisper
    template: templates/admin-deployment.yaml
    set:
      agent.voice.enabled: true
      agent.voice.provider: whisper
      agent.voice.elevenlabs.apiKey: el-secret
      agent.voice.elevenlabs.voiceId: vox-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WHISPER_SERVICE_URL
            value: http://r-shipwright-whisper:9000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ELEVENLABS_API_KEY
            valueFrom:
              secretKeyRef:
                name: r-shipwright-voice
                key: ELEVENLABS_API_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ELEVENLABS_VOICE_ID
            value: vox-1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GROQ_API_KEY
            valueFrom:
              secretKeyRef:
                name: r-shipwright-voice
                key: GROQ_API_KEY

  # ── (c) enabled + provider=groq → GROQ via secretKeyRef; no WHISPER URL ───
  - it: flows GROQ_API_KEY via secretKeyRef and omits WHISPER_SERVICE_URL when provider=groq
    template: templates/admin-deployment.yaml
    set:
      agent.voice.enabled: true
      agent.voice.provider: groq
      agent.voice.groq.apiKey: groq-secret
      agent.voice.elevenlabs.apiKey: el-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GROQ_API_KEY
            valueFrom:
              secretKeyRef:
                name: r-shipwright-voice
                key: GROQ_API_KEY
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WHISPER_SERVICE_URL
            value: http://r-shipwright-whisper:9000
