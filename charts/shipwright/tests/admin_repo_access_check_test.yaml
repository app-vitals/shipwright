suite: admin repo-access check feature flag
templates:
  - templates/admin-deployment.yaml
release:
  name: r
tests:
  - it: renders no SHIPWRIGHT_AGENT_REPO_ACCESS_CHECK_ENABLED by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_AGENT_REPO_ACCESS_CHECK_ENABLED
            value: "enabled"

  - it: renders SHIPWRIGHT_AGENT_REPO_ACCESS_CHECK_ENABLED when enabled
    set:
      admin.repoAccessCheck.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_AGENT_REPO_ACCESS_CHECK_ENABLED
            value: "enabled"
