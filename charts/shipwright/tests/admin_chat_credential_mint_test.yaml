suite: admin chat credential mint feature flag
templates:
  - templates/admin-deployment.yaml
release:
  name: r
tests:
  - it: renders no chat credential mint env by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_CHAT_TOKEN_MINT_ENABLED
            value: "enabled"

  - it: renders chat credential mint env when enabled
    set:
      admin.chatCredentialMint.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_CHAT_TOKEN_MINT_ENABLED
            value: "enabled"
