suite: agent Claude policy ConfigMap and admin env (ACP-2.1)
# agent.provisioning.claudePolicy renders a managed-settings.json ConfigMap and
# the admin env (name + sha256 of the rendered JSON) that the admin provisioner
# reads to mount the policy at /etc/claude-code in agent pods.
templates:
  - templates/agent-claude-policy-configmap.yaml
  - templates/admin-deployment.yaml
tests:
  - it: renders no ConfigMap by default
    template: templates/agent-claude-policy-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no policy env by default
    template: templates/admin-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_CLAUDE_POLICY_CONFIGMAP
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_CLAUDE_POLICY_HASH
          any: true

  - it: renders no policy env when provisioning is on but the policy is disabled
    template: templates/admin-deployment.yaml
    set:
      agent.provisioning.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_CLAUDE_POLICY_CONFIGMAP
          any: true

  - it: renders one ConfigMap with managed-settings.json equal to settings in the release namespace
    template: templates/agent-claude-policy-configmap.yaml
    release:
      name: r
      namespace: relns
    set:
      agent.provisioning.enabled: true
      agent.provisioning.claudePolicy.enabled: true
      agent.provisioning.claudePolicy.settings:
        permissions:
          deny:
            - "Bash(curl:*)"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.namespace
          value: relns
      - equal:
          path: data["managed-settings.json"]
          value: |-
            {
              "permissions": {
                "deny": [
                  "Bash(curl:*)"
                ]
              }
            }
      - isNotEmpty:
          path: metadata.name

  - it: uses agent.provisioning.namespace for the ConfigMap when set
    template: templates/agent-claude-policy-configmap.yaml
    release:
      name: r
      namespace: relns
    set:
      agent.provisioning.enabled: true
      agent.provisioning.namespace: agents
      agent.provisioning.claudePolicy.enabled: true
      agent.provisioning.claudePolicy.settings:
        permissions:
          deny:
            - "Bash(curl:*)"
    asserts:
      - equal:
          path: metadata.namespace
          value: agents

  - it: carries the ConfigMap name and settings hash on the admin Deployment
    template: templates/admin-deployment.yaml
    release:
      name: r
    set:
      agent.provisioning.enabled: true
      agent.provisioning.claudePolicy.enabled: true
      agent.provisioning.claudePolicy.settings:
        permissions:
          deny:
            - "Bash(curl:*)"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_CLAUDE_POLICY_CONFIGMAP
            value: r-shipwright-admin-agent-claude-policy
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_CLAUDE_POLICY_HASH
            value: 94ff74b250a766ec4ecf277c45995e4a035fb8be1379f4e20ec25b162a736ead

  - it: produces a different hash when a settings value changes
    template: templates/admin-deployment.yaml
    release:
      name: r
    set:
      agent.provisioning.enabled: true
      agent.provisioning.claudePolicy.enabled: true
      agent.provisioning.claudePolicy.settings:
        permissions:
          deny:
            - "Bash(wget:*)"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_CLAUDE_POLICY_HASH
            value: 8e7bda62591e4fe15a951e4a730fe7255ad6a7a2f34cb0753a16b07c9650952e

  - it: ConfigMap name matches the admin env value
    template: templates/agent-claude-policy-configmap.yaml
    release:
      name: r
    set:
      agent.provisioning.enabled: true
      agent.provisioning.claudePolicy.enabled: true
      agent.provisioning.claudePolicy.settings:
        permissions:
          deny:
            - "Bash(curl:*)"
    asserts:
      - equal:
          path: metadata.name
          value: r-shipwright-admin-agent-claude-policy

  - it: fails naming agent.provisioning.claudePolicy when enabled with provisioning disabled
    template: templates/agent-claude-policy-configmap.yaml
    set:
      agent.provisioning.claudePolicy.enabled: true
      agent.provisioning.claudePolicy.settings:
        permissions:
          deny:
            - "Bash(curl:*)"
    asserts:
      - failedTemplate:
          errorPattern: "agent.provisioning.claudePolicy"

  - it: fails naming agent.provisioning.claudePolicy when enabled with empty settings
    template: templates/agent-claude-policy-configmap.yaml
    set:
      agent.provisioning.enabled: true
      agent.provisioning.claudePolicy.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "agent.provisioning.claudePolicy"
