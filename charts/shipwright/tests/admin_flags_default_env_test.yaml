suite: admin default env golden (COS-34.1)
templates:
  - templates/admin-deployment.yaml
release:
  name: r
tests:
  - it: renders exactly the pre-change admin container env with default values
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL_SHIPWRIGHT_ADMIN
              valueFrom:
                secretKeyRef:
                  name: r-shipwright-admin
                  key: DATABASE_URL_SHIPWRIGHT_ADMIN
            - name: SHIPWRIGHT_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: r-shipwright-admin
                  key: SHIPWRIGHT_SESSION_SECRET
            - name: SHIPWRIGHT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: r-shipwright-admin
                  key: SHIPWRIGHT_ENCRYPTION_KEY
            - name: NODE_ENV
              value: "development"
            - name: ADMIN_DEV_AUTH
              value: "true"

  - it: renders none of the optional admin flag envs by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_AGENT_ASK_ENABLED
            value: "enabled"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_CHAT_TOKEN_MINT_ENABLED
            value: "enabled"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_ADMIN_DOC_ENABLED
            value: "enabled"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_K8S_AGENT_POD_SERVICE_ACCOUNT_ENABLED
            value: "enabled"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_CRON_RUN_NOW_ENABLED
            value: "enabled"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_TRANSCRIPT_API_ENABLED
            value: "enabled"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_AGENT_REPO_ACCESS_CHECK_ENABLED
            value: "enabled"
