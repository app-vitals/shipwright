suite: admin feature flags default env (no new env vars with default values)
templates:
  - templates/admin-deployment.yaml
release:
  name: r
tests:
  - it: produces identical admin Deployment container env with default values as origin/main
    asserts:
      # Verify that the env section matches the original with no ask/chatCredentialMint/doc env vars
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORT
            value: "3001"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL_SHIPWRIGHT_ADMIN
            valueFrom:
              secretKeyRef:
                name: r-shipwright-admin
                key: DATABASE_URL_SHIPWRIGHT_ADMIN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: r-shipwright-admin
                key: SHIPWRIGHT_SESSION_SECRET
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: r-shipwright-admin
                key: SHIPWRIGHT_ENCRYPTION_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_ENV
            value: "development"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_DEV_AUTH
            value: "true"
      # Verify the new flags are NOT present by default
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_AGENT_ASK_ENABLED
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_AGENT_ASK_ALLOWLIST
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_CHAT_TOKEN_MINT_ENABLED
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_ADMIN_DOC_ENABLED
