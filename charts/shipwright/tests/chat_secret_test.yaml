suite: chat Secret — bundled-PostgreSQL DSN assembly and opt-in gating
# Mirrors task_store_secret_test.yaml; see there for the full rationale. The
# chart-managed chat Secret exists ONLY when chat.database.existingSecret is ""
# AND the bundled PostgreSQL is enabled, so no pre-existing install renders it.
templates:
  - templates/chat-secret.yaml
release:
  name: r
  namespace: shipwright
tests:
  - it: renders no Secret by default (existingSecret defaults to shipwright-secrets)
    set:
      chat.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Secret when chat is disabled, even on the bundled path
    set:
      chat.enabled: false
      chat.database.existingSecret: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Secret when an external database Secret is named
    set:
      chat.enabled: true
      chat.database.existingSecret: my-external-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Secret when the bundled PostgreSQL is disabled
    set:
      chat.enabled: true
      chat.database.existingSecret: ""
      postgresql.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: assembles the DSN against its OWN database on the bundled path
    set:
      chat.enabled: true
      chat.database.existingSecret: ""
      postgresql.auth.password: testpw
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: r-shipwright-chat
      - equal:
          path: type
          value: Opaque
      - matchRegex:
          path: data.DATABASE_URL_SHIPWRIGHT_CHAT
          decodeBase64: true
          pattern: "^postgresql://shipwright:testpw@r-postgresql:5432/shipwright_chat$"

  - it: targets a database SEPARATE from admin, metrics and task-store
    set:
      chat.enabled: true
      chat.database.existingSecret: ""
      postgresql.auth.password: testpw
    asserts:
      - notMatchRegex:
          path: data.DATABASE_URL_SHIPWRIGHT_CHAT
          decodeBase64: true
          pattern: "/(shipwright_admin|shipwright_metrics|shipwright_task_store)$"

  - it: tracks chat.database.name into the DSN
    set:
      chat.enabled: true
      chat.database.existingSecret: ""
      chat.database.name: custom_chat_db
      postgresql.auth.password: testpw
    asserts:
      - matchRegex:
          path: data.DATABASE_URL_SHIPWRIGHT_CHAT
          decodeBase64: true
          pattern: "/custom_chat_db$"

  - it: carries the chat component label
    set:
      chat.enabled: true
      chat.database.existingSecret: ""
      postgresql.auth.password: testpw
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: chat
