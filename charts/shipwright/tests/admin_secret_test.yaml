suite: admin Secret — generation, DB URL assembly, persistence idiom
# HD-3.1 chart-managed admin Secret. helm-unittest (like `helm template`) does
# NOT execute `lookup`, so these always exercise the GENERATE branch — a fresh
# randAlphaNum session secret and a sha256-derived 64-char-hex encryption key,
# both b64-encoded. The persistence-on-upgrade behavior is the lookup-then-reuse
# branch, which only fires on a live cluster; here we assert it renders valid
# generated material and assembles the DB URL safely.
templates:
  - templates/admin-secret.yaml
release:
  name: r
  namespace: shipwright
tests:
  - it: renders an Opaque Secret named for the admin component
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: r-shipwright-admin

  - it: generates a base64 session secret and a 64-char-hex encryption key
    asserts:
      # Session secret: 32 random alphanumerics, base64-encoded → non-empty base64.
      - matchRegex:
          path: data.SHIPWRIGHT_SESSION_SECRET
          pattern: "^[A-Za-z0-9+/]+=*$"
      - isNotEmpty:
          path: data.SHIPWRIGHT_SESSION_SECRET
      # Encryption key MUST decode to a 64-char hex string (32 bytes for
      # AES-256-GCM). crypto.ts does Buffer.from(key, "hex"); a shorter or
      # non-hex value throws "Invalid key length" at the first encrypt.
      - matchRegex:
          path: data.SHIPWRIGHT_ENCRYPTION_KEY
          decodeBase64: true
          pattern: "^[0-9a-f]{64}$"
      - isNotEmpty:
          path: data.SHIPWRIGHT_ENCRYPTION_KEY

  - it: omits SHIPWRIGHT_SESSION_SECRET and SHIPWRIGHT_ENCRYPTION_KEY when encryptionKeys.existingSecret is set
    set:
      admin.encryptionKeys.existingSecret: my-keys-secret
      admin.encryptionKeys.encryptionKeyRef: SHIPWRIGHT_ENCRYPTION_KEY
      admin.encryptionKeys.sessionSecretRef: SHIPWRIGHT_SESSION_SECRET
    asserts:
      - notExists:
          path: data.SHIPWRIGHT_SESSION_SECRET
      - notExists:
          path: data.SHIPWRIGHT_ENCRYPTION_KEY

  - it: assembles DATABASE_URL_SHIPWRIGHT_ADMIN into the Secret when postgresql is enabled
    set:
      postgresql.enabled: true
      postgresql.auth.username: shipwright
      postgresql.auth.database: shipwright_admin
      postgresql.auth.password: testpw
    asserts:
      - isNotEmpty:
          path: data.DATABASE_URL_SHIPWRIGHT_ADMIN
      # base64-decoded value points the user@<release>-postgresql:5432/db URL.
      - equal:
          path: data.DATABASE_URL_SHIPWRIGHT_ADMIN
          decodeBase64: true
          value: postgresql://shipwright:testpw@r-postgresql:5432/shipwright_admin

  - it: omits the DB URL key when postgresql is disabled (bring-your-own DB)
    set:
      postgresql.enabled: false
    asserts:
      - notExists:
          path: data.DATABASE_URL_SHIPWRIGHT_ADMIN

  - it: includes Google OAuth credentials only in google mode
    set:
      auth.mode: google
      auth.google.clientId: cid
      auth.google.clientSecret: csec
      auth.google.allowedEmails: dev@example.com
    asserts:
      - equal:
          path: data.GOOGLE_CLIENT_ID
          decodeBase64: true
          value: cid
      - equal:
          path: data.GOOGLE_CLIENT_SECRET
          decodeBase64: true
          value: csec

  - it: omits Google OAuth credentials in open mode
    set:
      auth.mode: open
    asserts:
      - notExists:
          path: data.GOOGLE_CLIENT_ID
      - notExists:
          path: data.GOOGLE_CLIENT_SECRET

  - it: omits GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET when auth.google.existingSecret is set
    set:
      auth.mode: google
      auth.google.existingSecret: my-google-secret
      auth.google.clientIdRef: GOOGLE_CLIENT_ID
      auth.google.clientSecretRef: GOOGLE_CLIENT_SECRET
      auth.google.allowedEmailsRef: SHIPWRIGHT_ADMIN_ALLOWED_EMAILS
    asserts:
      - notExists:
          path: data.GOOGLE_CLIENT_ID
      - notExists:
          path: data.GOOGLE_CLIENT_SECRET

  - it: includes Okta OIDC credentials only in okta mode
    set:
      auth.mode: okta
      auth.okta.issuer: https://dev-123.okta.com
      auth.okta.clientId: cid
      auth.okta.clientSecret: csec
      auth.okta.allowedEmails: dev@example.com
    asserts:
      - equal:
          path: data.OKTA_ISSUER
          decodeBase64: true
          value: https://dev-123.okta.com
      - equal:
          path: data.OKTA_CLIENT_ID
          decodeBase64: true
          value: cid
      - equal:
          path: data.OKTA_CLIENT_SECRET
          decodeBase64: true
          value: csec

  - it: omits Okta OIDC credentials in open mode
    set:
      auth.mode: open
    asserts:
      - notExists:
          path: data.OKTA_ISSUER
      - notExists:
          path: data.OKTA_CLIENT_ID
      - notExists:
          path: data.OKTA_CLIENT_SECRET

  - it: omits OKTA_ISSUER, OKTA_CLIENT_ID and OKTA_CLIENT_SECRET when auth.okta.existingSecret is set
    set:
      auth.mode: okta
      auth.okta.existingSecret: my-okta-secret
      auth.okta.issuerRef: OKTA_ISSUER
      auth.okta.clientIdRef: OKTA_CLIENT_ID
      auth.okta.clientSecretRef: OKTA_CLIENT_SECRET
      auth.okta.allowedEmailsRef: SHIPWRIGHT_ADMIN_ALLOWED_EMAILS
    asserts:
      - notExists:
          path: data.OKTA_ISSUER
      - notExists:
          path: data.OKTA_CLIENT_ID
      - notExists:
          path: data.OKTA_CLIENT_SECRET
