suite: admin doc feature flag
templates:
  - templates/admin-deployment.yaml
release:
  name: r
tests:
  - it: renders no doc env by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_ADMIN_DOC_ENABLED
            value: "enabled"

  - it: renders doc env when enabled
    set:
      admin.doc.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_ADMIN_DOC_ENABLED
            value: "enabled"
