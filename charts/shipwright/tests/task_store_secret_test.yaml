suite: task-store Secret — bundled-PostgreSQL DSN assembly and opt-in gating
# The chart-managed task-store Secret exists ONLY on the bundled-PostgreSQL path
# (taskStore.database.existingSecret == "" AND postgresql.enabled). Because that
# value defaults to the non-empty "shipwright-secrets", no pre-existing install
# renders this Secret — opting in is explicit.
#
# NOTE: helm-unittest does NOT execute `lookup`, so postgresql.auth.password must
# be set explicitly in these tests to get a non-empty password in the DSN. That
# mirrors what examples/values-minikube.yaml does for a single-shot install.
templates:
  - templates/task-store-secret.yaml
release:
  name: r
  namespace: shipwright
tests:
  - it: renders no Secret by default (existingSecret defaults to shipwright-secrets)
    set:
      taskStore.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Secret when taskStore is disabled, even on the bundled path
    set:
      taskStore.enabled: false
      taskStore.database.existingSecret: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Secret when an external database Secret is named
    set:
      taskStore.enabled: true
      taskStore.database.existingSecret: my-external-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Secret when the bundled PostgreSQL is disabled
    # The Deployment `fail`s in this combination — see task_store_workload_test.
    set:
      taskStore.enabled: true
      taskStore.database.existingSecret: ""
      postgresql.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: assembles the DSN against its OWN database on the bundled path
    set:
      taskStore.enabled: true
      taskStore.database.existingSecret: ""
      postgresql.auth.password: testpw
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: r-shipwright-task-store
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.DATABASE_URL_SHIPWRIGHT_TASK_STORE
          # postgresql://shipwright:testpw@r-postgresql:5432/shipwright_task_store
          value: cG9zdGdyZXNxbDovL3NoaXB3cmlnaHQ6dGVzdHB3QHItcG9zdGdyZXNxbDo1NDMyL3NoaXB3cmlnaHRfdGFza19zdG9yZQ==

  - it: targets a database SEPARATE from admin, metrics and chat
    # Sharing one database across Prisma services breaks `prisma migrate deploy`
    # with Prisma P3005 — this is the assertion that keeps them apart.
    set:
      taskStore.enabled: true
      taskStore.database.existingSecret: ""
      postgresql.auth.password: testpw
    asserts:
      - matchRegex:
          path: data.DATABASE_URL_SHIPWRIGHT_TASK_STORE
          decodeBase64: true
          pattern: "/shipwright_task_store$"
      - notMatchRegex:
          path: data.DATABASE_URL_SHIPWRIGHT_TASK_STORE
          decodeBase64: true
          pattern: "/(shipwright_admin|shipwright_metrics|shipwright_chat)$"

  - it: tracks taskStore.database.name into the DSN
    set:
      taskStore.enabled: true
      taskStore.database.existingSecret: ""
      taskStore.database.name: custom_ts_db
      postgresql.auth.password: testpw
    asserts:
      - matchRegex:
          path: data.DATABASE_URL_SHIPWRIGHT_TASK_STORE
          decodeBase64: true
          pattern: "/custom_ts_db$"

  - it: tracks a custom postgresql.auth.username into the DSN
    set:
      taskStore.enabled: true
      taskStore.database.existingSecret: ""
      postgresql.auth.username: appowner
      postgresql.auth.password: testpw
    asserts:
      - matchRegex:
          path: data.DATABASE_URL_SHIPWRIGHT_TASK_STORE
          decodeBase64: true
          pattern: "^postgresql://appowner:testpw@r-postgresql:5432/"

  - it: carries the task-store component label
    set:
      taskStore.enabled: true
      taskStore.database.existingSecret: ""
      postgresql.auth.password: testpw
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: task-store
