suite: admin cron run-now feature flag
templates:
  - templates/admin-deployment.yaml
release:
  name: r
tests:
  - it: renders no SHIPWRIGHT_CRON_RUN_NOW_ENABLED by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_CRON_RUN_NOW_ENABLED
            value: "enabled"

  - it: renders SHIPWRIGHT_CRON_RUN_NOW_ENABLED when enabled
    set:
      admin.cronRunNow.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_CRON_RUN_NOW_ENABLED
            value: "enabled"
