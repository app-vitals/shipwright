apiVersion: v2
name: shipwright
description: >-
  Shipwright Harness — the open-source autonomous delivery agent for Claude Code.
  This chart packages the Shipwright services (admin, metrics, task-store, chat)
  plus runtime agent provisioning and an optional bundled PostgreSQL, for
  Kubernetes (Minikube-friendly defaults).
type: application
# Chart version (SemVer). Bump on every chart change, independent of appVersion.
# See CHANGELOG.md and the README "Versioning" section — CI enforces this bump
# via `ct lint --check-version-increment`.
version: 1.19.2
# Version of the Shipwright application this chart deploys by default.
appVersion: "0.1.0"
home: https://shipwrightharness.com
sources:
  - https://github.com/app-vitals/shipwright
keywords:
  - shipwright
  - claude-code
  - delivery-agent
  - ci-cd
maintainers:
  - name: Shipwright Harness
    url: https://shipwrightharness.com
# License: MIT (chart + application).
annotations:
  licenses: MIT
  # Artifact Hub change log for this release. Must mirror the matching version
  # entry in CHANGELOG.md (keep the two in sync on every bump).
  artifacthub.io/changes: |
    - kind: changed
      description: "Derive admin.appBaseUrl from the public host (CNH-9.1). New shipwright.admin.appBaseUrl helper: an explicit admin.appBaseUrl value always wins; when empty and networking.type is ingress or gateway, SHIPWRIGHT_ADMIN_APP_BASE_URL is derived as <scheme>://<public host>; otherwise the env var is omitted (ClusterIP/NodePort/LoadBalancer installs unchanged). NOTES.txt and README.md updated to reflect the new precedence."
    - kind: changed
      description: "auto-bump to chart v1.19.1 triggered by release tag(s): admin-v1.98.0, agent-v1.197.0, chat-v1.53.0, metrics-v1.56.0, task-store-v1.78.0"
    - kind: changed
      description: "Cloud-native docs and release (CNH-8.4). README.md gains Values rows for ingress-nginx.enabled/traefik.enabled/cert-manager.enabled, a Dependencies table listing all four vendored subcharts (postgresql, ingress-nginx, traefik, cert-manager) with versions/repositories/conditions, and a new 'Cloud-native install (single chart)' section with a warning against bundling cert-manager on a cluster that already has it. docs/deploy-kubernetes.md gains a new 'Cloud-native (any cluster)' deployment-target section (install commands for both the ingress-nginx and Traefik bundled variants, the same cert-manager-collision warning, and cross-links to the existing Bundled ingress controllers reference and Minikube profiles). docs/helm-repo.md now states the chart vendors four optional subcharts up front."
dependencies:
  # Bitnami PostgreSQL subchart. Pinned to a chart version whose default image tag
  # is concrete (NOT `latest`), because Bitnami's 2025 catalog change moved newer
  # chart lines to `tag: latest` behind Bitnami Secure. See README for the
  # `bitnamilegacy` mirror fallback if these tags are pulled from the public registry.
  - name: postgresql
    version: "16.7.27"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  # Optional bundled ingress controller subcharts (CNH-6.1). Both default off
  # (condition: <name>.enabled) — bring your own ingress controller unless you
  # opt in. Only one should be enabled at a time (templates/_validation.tpl
  # fails the render if both are on simultaneously).
  - name: ingress-nginx
    version: "4.15.1"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
  - name: traefik
    version: "41.3.0"
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
  # Optional bundled cert-manager subchart (CNH-6.1), default off. Bring your
  # own cert-manager unless you opt in via cert-manager.enabled=true.
  - name: cert-manager
    version: "v1.21.1"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
