apiVersion: v2
name: shipwright
description: >-
  Shipwright Harness — the open-source autonomous delivery agent for Claude Code.
  This chart packages the Shipwright services (admin, metrics, task-store, chat)
  plus runtime agent provisioning and an optional bundled PostgreSQL, for
  Kubernetes (Minikube-friendly defaults).
type: application
# Chart version (SemVer). Bump on every chart change, independent of appVersion.
# See CHANGELOG.md and the README "Versioning" section — CI enforces this bump
# via `ct lint --check-version-increment`.
version: 1.11.32
# Version of the Shipwright application this chart deploys by default.
appVersion: "0.1.0"
home: https://shipwrightharness.com
sources:
  - https://github.com/app-vitals/shipwright
keywords:
  - shipwright
  - claude-code
  - delivery-agent
  - ci-cd
maintainers:
  - name: Shipwright Harness
    url: https://shipwrightharness.com
# License: MIT (chart + application).
annotations:
  licenses: MIT
  # Artifact Hub change log for this release. Must mirror the matching version
  # entry in CHANGELOG.md (keep the two in sync on every bump).
  artifacthub.io/changes: |
    - kind: fixed
      description: "ingress: metrics /dashboard and admin / paths switch to no-op-rewrite capture-group paths when task-store's shared rewrite-target is active, preventing 404s on Apple Silicon/minikube deployments (task minikube:up reliability)"
    - kind: fixed
      description: "metrics liveness/readiness probes and the helm test now honor metrics.provider.basePath instead of assuming a bare /health or /dashboard path"
    - kind: changed
      description: "examples/values-minikube.yaml — added explicit CPU/memory resource requests/limits for metrics, taskStore, and chat"
dependencies:
  # Bitnami PostgreSQL subchart. Pinned to a chart version whose default image tag
  # is concrete (NOT `latest`), because Bitnami's 2025 catalog change moved newer
  # chart lines to `tag: latest` behind Bitnami Secure. See README for the
  # `bitnamilegacy` mirror fallback if these tags are pulled from the public registry.
  - name: postgresql
    version: "16.7.27"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
