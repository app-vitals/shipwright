apiVersion: v2
name: shipwright
description: >-
  Shipwright Harness — the open-source autonomous delivery agent for Claude Code.
  This chart packages the Shipwright services (admin, metrics, task-store, chat)
  plus runtime agent provisioning and an optional bundled PostgreSQL, for
  Kubernetes (Minikube-friendly defaults).
type: application
# Chart version (SemVer). Bump on every chart change, independent of appVersion.
# See CHANGELOG.md and the README "Versioning" section — CI enforces this bump
# via `ct lint --check-version-increment`.
version: 1.18.0
# Version of the Shipwright application this chart deploys by default.
appVersion: "0.1.0"
home: https://shipwrightharness.com
sources:
  - https://github.com/app-vitals/shipwright
keywords:
  - shipwright
  - claude-code
  - delivery-agent
  - ci-cd
maintainers:
  - name: Shipwright Harness
    url: https://shipwrightharness.com
# License: MIT (chart + application).
annotations:
  licenses: MIT
  # Artifact Hub change log for this release. Must mirror the matching version
  # entry in CHANGELOG.md (keep the two in sync on every bump).
  artifacthub.io/changes: |
    - kind: added
      description: "Cloud-native profiles: examples, CI variants, kind e2e assertions (CNH-8.1). examples/values-cloud-native.yaml now sets admin.appBaseUrl (https://shipwright.local:8443) for OAuth redirects, and its networking.ingress.host moved to the shipwright.local placeholder (matching the selfsigned cert this profile issues); examples/values-cloud-native-traefik.yaml gains the same admin.appBaseUrl treatment (https://shipwright.example.com, matching its real letsencrypt-prod issuer). Two new ct-discovered ci/ values variants — ci/cloud-native-nginx-values.yaml (ingress-nginx ClusterIP + small resources, cert-manager with crds.keep=false + small resources, tls.certManager.enabled + issuer.create selfsigned, task-store exposed — the only ci/ variant that bundles cert-manager) and ci/cloud-native-traefik-values.yaml (traefik ClusterIP + small resources, no cert-manager, plain HTTP) — extend the helm-e2e kind matrix from three to five variants. templates/tests/test-connection.yaml gains an ingress-nginx-gated HTTPS retry-loop block (curls THROUGH the bundled ingress-nginx controller Service via --connect-to, asserting the served cert is not ingress-nginx's default 'Kubernetes Ingress Controller Fake Certificate' placeholder, then checks /task-store/health -> 200) and a traefik-gated block (Host-header curl through the bundled traefik Service, plain HTTP, /task-store/health -> 200). New templates/tests/test-cert-issuer.yaml — gated identically to templates/cert-manager-bootstrap-job.yaml (shipwright.certManager.viaHook) with its own dedicated ServiceAccount/Role/RoleBinding (+ClusterRole/Binding for a ClusterIssuer) — kubectl waits for the chart-managed Issuer and the cert-manager-ingress-shim-created Certificate (<fullname>-tls) to reach Ready. New .github/workflows/helm.yml + Taskfile.yml helm:validate kubeconform step validates examples/values-cloud-native.yaml with -skip CustomResourceDefinition (cert-manager ships its CRDs as regular templates, unlike ingress-nginx/traefik's Helm crds/ directory convention which helm template never renders). templates/NOTES.txt now prints a Public URL line (admin.appBaseUrl when set, else constructed from shipwright.publicScheme/publicHost), one line per bundled optional subchart (ingress-nginx/traefik/cert-manager), and a Let's Encrypt STAGING warning when tls.certManager.issuer.server points at the ACME staging endpoint. New tests/cloud_native_profile_test.yaml (helm-unittest) asserts, per profile: Ingress spec.tls (nginx only), the cert-manager bootstrap Job (nginx only), the bundled controller Deployment renders, no inline Issuer/Certificate document, ingressClassName matches the bundled class, and the new test hooks' gating."
    - kind: fixed
      description: "Bundled Traefik profile routed nothing (404 through the controller): the subchart's IngressClass defaulted to <release>-traefik while the chart's Ingress uses ingressClassName traefik. values.yaml now pins traefik.ingressClass.name to traefik so they agree out of the box."
dependencies:
  # Bitnami PostgreSQL subchart. Pinned to a chart version whose default image tag
  # is concrete (NOT `latest`), because Bitnami's 2025 catalog change moved newer
  # chart lines to `tag: latest` behind Bitnami Secure. See README for the
  # `bitnamilegacy` mirror fallback if these tags are pulled from the public registry.
  - name: postgresql
    version: "16.7.27"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  # Optional bundled ingress controller subcharts (CNH-6.1). Both default off
  # (condition: <name>.enabled) — bring your own ingress controller unless you
  # opt in. Only one should be enabled at a time (templates/_validation.tpl
  # fails the render if both are on simultaneously).
  - name: ingress-nginx
    version: "4.15.1"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
  - name: traefik
    version: "41.3.0"
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
  # Optional bundled cert-manager subchart (CNH-6.1), default off. Bring your
  # own cert-manager unless you opt in via cert-manager.enabled=true.
  - name: cert-manager
    version: "v1.21.1"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
