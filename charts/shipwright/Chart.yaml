apiVersion: v2
name: shipwright
description: >-
  Shipwright Harness — the open-source autonomous delivery agent for Claude Code.
  This chart packages the Shipwright services (admin, metrics, task-store, chat)
  plus runtime agent provisioning and an optional bundled PostgreSQL, for
  Kubernetes (Minikube-friendly defaults).
type: application
# Chart version FLOOR (MAJOR.MINOR.0). The published version is derived at
# publish time by chart-release.yml: MAJOR.MINOR from here, patch = highest
# published patch + 1 (ADR 0001). Edit by hand only for a deliberate
# minor/major bump.
version: 1.32.0
# Version of the Shipwright application this chart deploys by default.
appVersion: "0.1.0"
home: https://shipwrightharness.com
sources:
  - https://github.com/app-vitals/shipwright
keywords:
  - shipwright
  - claude-code
  - delivery-agent
  - ci-cd
maintainers:
  - name: Shipwright Harness
    url: https://shipwrightharness.com
# License: MIT (chart + application).
annotations:
  licenses: MIT
  # Artifact Hub change log. Replaced at publish time with the stamped pins
  # (chart-release.yml); the value committed here is a placeholder.
  artifacthub.io/changes: |
    - kind: changed
      description: "see the chart-<version> git tag for this release's record"
dependencies:
  # Shared platform helpers (CHM-3.1): the agent-platform library chart owns the
  # name/label/image helpers this chart's `shipwright.*` helpers delegate to.
  # Published anonymously on GitHub Pages — `helm dependency build` needs no
  # credentials. Library charts render nothing, so no condition.
  - name: agent-platform
    version: "0.4.0"
    repository: https://app-vitals.github.io/agent
  # Bitnami PostgreSQL subchart, pinned to the chart release shipping Postgres 18.x
  # (appVersion 18.6.0). Every current chart release defaults image.tag to `latest`
  # (Bitnami's 2025 catalog change), and the `bitnamilegacy` mirror never received a
  # Postgres 18 build (frozen at 17.6.0) — so determinism here comes from pinning
  # `postgresql.image.digest` in values.yaml instead of a concrete tag. See README
  # "Bitnami registry risk" for the full explanation.
  - name: postgresql
    version: "18.12.25"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  # Optional bundled ingress controller subcharts (CNH-6.1). Both default off
  # (condition: <name>.enabled) — bring your own ingress controller unless you
  # opt in. Only one should be enabled at a time (templates/_validation.tpl
  # fails the render if both are on simultaneously).
  - name: ingress-nginx
    version: "4.15.1"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
  - name: traefik
    version: "42.4.1"
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
  # Optional bundled cert-manager subchart (CNH-6.1), default off. Bring your
  # own cert-manager unless you opt in via cert-manager.enabled=true.
  - name: cert-manager
    version: "v1.21.3"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
