apiVersion: v2
name: shipwright
description: >-
  Shipwright Harness — the open-source autonomous delivery agent for Claude Code.
  This chart packages the Shipwright services (admin, metrics, task-store, chat)
  plus runtime agent provisioning and an optional bundled PostgreSQL, for
  Kubernetes (Minikube-friendly defaults).
type: application
# Chart version (SemVer). Bump on every chart change, independent of appVersion.
# See CHANGELOG.md and the README "Versioning" section — CI enforces this bump
# via `ct lint --check-version-increment`.
version: 1.16.0
# Version of the Shipwright application this chart deploys by default.
appVersion: "0.1.0"
home: https://shipwrightharness.com
sources:
  - https://github.com/app-vitals/shipwright
keywords:
  - shipwright
  - claude-code
  - delivery-agent
  - ci-cd
maintainers:
  - name: Shipwright Harness
    url: https://shipwrightharness.com
# License: MIT (chart + application).
annotations:
  licenses: MIT
  # Artifact Hub change log for this release. Must mirror the matching version
  # entry in CHANGELOG.md (keep the two in sync on every bump).
  artifacthub.io/changes: |
    - kind: added
      description: "bundle optional ingress-nginx/traefik/cert-manager subcharts, default off (CNH-6.1): Chart.yaml grows three new dependencies alongside the existing postgresql one — ingress-nginx (4.15.1, https://kubernetes.github.io/ingress-nginx, condition ingress-nginx.enabled), traefik (41.3.0, https://traefik.github.io/charts, condition traefik.enabled), and cert-manager (v1.21.1, https://charts.jetstack.io, condition cert-manager.enabled) — each vendored as a .tgz under charts/shipwright/charts/ with Chart.lock pinning exact versions (no ranges). All three default to disabled (values.yaml top-level ingress-nginx.enabled/traefik.enabled/cert-manager.enabled: false), so `helm template` output with default values is byte-identical to before this change. values.yaml also sets ingress-nginx.controller.admissionWebhooks.enabled=false (the admission webhook path needs a job that reaches a running API server at install time, unsafe to force on by default) and, within the cert-manager block, crds.enabled=true/crds.keep=true/startupapicheck.enabled=true (so enabling cert-manager.enabled=true renders its CRDs inline — no separate CRD chart needed, per the jetstack chart's v1.15+ convention). values.schema.json documents the three new hyphenated top-level keys with loose (additionalProperties: true) `enabled`-only shapes, matching the existing postgresql entry's style. New templates/_validation.tpl check: ingress-nginx.enabled=true together with traefik.enabled=true fails the render (two bundled ingress controller subcharts installed simultaneously is contradictory), surfaced via the existing shipwright.validate call in NOTES.txt. New tests/bundled_subcharts_test.yaml covers the enabled/disabled render matrix for all three subcharts' key resources (ingress-nginx controller Deployment, traefik Deployment, cert-manager Certificate CRD) plus the new both-enabled validation failure; tests/ingress_traefik_test.yaml grows a case asserting the bundled traefik subchart's own IngressClass and this chart's Ingress agree on the effective class name (traefik). New examples/values-cloud-native.yaml demonstrates a fully self-contained install (bundled ingress-nginx + cert-manager, no external dependencies); examples/values-cloud-native-traefik.yaml is extended to also bundle the traefik subchart (traefik.enabled=true) rather than assuming an externally-installed Traefik. ct.yaml gains helm-extra-args: [--timeout, 600s] since cert-manager's startupapicheck can exceed the default install timeout in CI's kind cluster."
    - kind: added
      description: "chart-created cert-manager Issuer for external cert-manager (CNH-5.1): new templates/cert-manager-issuer.yaml renders a cert-manager.io/v1 (Cluster)Issuer via shipwright.certManager.issuerManifest when tls.certManager.issuer.create=true and no explicit issuerRef.name is set (shipwright.certManager.createIssuer). Supports issuer.type=letsencrypt (spec.acme.{email,server,privateKeySecretRef: <issuer>-acme-account, solvers[0].http01.ingress.ingressClassName: <effective class>}, email required) and issuer.type=selfsigned (spec.selfSigned: {}). Kind Issuer (the new default) renders an explicit metadata.namespace; ClusterIssuer renders none. Name is <fullname>-issuer. An explicit issuerRef.name always suppresses chart-managed creation. values.yaml default tls.certManager.issuer.kind changes from ClusterIssuer to Issuer, and issuer.type's enum grows selfsigned — both no-ops for default values (issuer.create defaults to false, so this template never renders by default). helm template output is byte-identical for existing users."
    - kind: added
      description: "ingress TLS/cert-manager helpers, validation, and values/schema groundwork (networking.ingress.controller/tls, tls.certManager.issuer) — no render change; nothing new is wired into templates/ingress.yaml yet"
    - kind: added
      description: "wire ingress TLS + cert-manager ingress-shim annotations into templates/ingress.yaml (nginx): renders spec.tls when networking.ingress.tls.enabled or tls.certManager.enabled, adds the nginx.ingress.kubernetes.io/ssl-redirect annotation when TLS + redirect + controller=nginx, and adds cert-manager.io/issuer or cert-manager.io/cluster-issuer keyed by the effective issuer kind/name — no chart-rendered Certificate CR on the ingress path, so TLS works on first install regardless of cert-manager readiness"
    - kind: added
      description: "Traefik ingress controller support (CNH-4.1): templates/ingress.yaml grows a traefik dialect branch (guarded on shipwright.bundled.traefik, nothing changes for controller=nginx) adding traefik.ingress.kubernetes.io/router.entrypoints (websecure when TLS is on, else web, using the configurable networking.ingress.traefik.entrypoints names), router.tls: \"true\" when TLS is on, and router.middlewares (<ns>-<fullname>-task-store-strip@kubernetescrd) when the task-store route is exposed; traefik paths are always plain Prefix (/dashboard, the configured taskStore.expose.pathPrefix, /) with no capture-group regex and no nginx rewrite-target annotation, since prefix-stripping is delegated to a Middleware instead. New templates/ingress-traefik-middleware.yaml renders a StripPrefix Middleware (<fullname>-task-store-strip) when task-store is exposed and a redirectScheme Middleware (<fullname>-redirect-https) when TLS + redirect are on, both traefik.io/v1alpha1 and controller-gated. New templates/ingress-http-redirect.yaml renders a separate plain-HTTP Ingress (<fullname>-http-redirect, no spec.tls, entrypoint web) bound to the redirect-https Middleware, needed because a TLS-enabled Ingress is a TLS-only router in Traefik's model. New tests/ingress_traefik_test.yaml and tests/ingress_traefik_middleware_test.yaml (helm-unittest) cover the full traefik x {TLS off/on} x {task-store exposed off/on} matrix plus the zero-render cases for nginx/ClusterIP. New examples/values-cloud-native-traefik.yaml plus a matching kubeconform CI step (.github/workflows/helm.yml) and Taskfile.yml helm:validate command validate the traefik.io/v1alpha1 Middleware CRD schema via the existing datreeio CRDs-catalog schema-location. No values.yaml/values.schema.json changes — this consumes controller/tls/traefik.entrypoints keys already added in CNH-2.1/CNH-3.1. Default-values (nginx) render output is unchanged."
dependencies:
  # Bitnami PostgreSQL subchart. Pinned to a chart version whose default image tag
  # is concrete (NOT `latest`), because Bitnami's 2025 catalog change moved newer
  # chart lines to `tag: latest` behind Bitnami Secure. See README for the
  # `bitnamilegacy` mirror fallback if these tags are pulled from the public registry.
  - name: postgresql
    version: "16.7.27"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  # Optional bundled ingress controller subcharts (CNH-6.1). Both default off
  # (condition: <name>.enabled) — bring your own ingress controller unless you
  # opt in. Only one should be enabled at a time (templates/_validation.tpl
  # fails the render if both are on simultaneously).
  - name: ingress-nginx
    version: "4.15.1"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
  - name: traefik
    version: "41.3.0"
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
  # Optional bundled cert-manager subchart (CNH-6.1), default off. Bring your
  # own cert-manager unless you opt in via cert-manager.enabled=true.
  - name: cert-manager
    version: "v1.21.1"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
