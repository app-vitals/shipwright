name: Rehearse extraction

# AGR-1.7: proves the app-vitals/agent cut is ready, and keeps it ready while
# this repository keeps moving. Runs scripts/rehearse-extraction.ts, which
# extracts the platform (no-history and history mode) into a scratch dir and
# runs install / typecheck / lint / boundary gate / bun test / both Dockerfile
# builds / the base-image contract smoke test inside the extracted tree.
#
# Scheduled and manual only — not on every PR. A failing run fails the
# workflow, which pages through GitHub's failed-workflow notification (the same
# path check-chart-drift.yml relies on).
#
# Run locally: bun scripts/rehearse-extraction.ts --mode no-history --skip-docker

on:
  schedule:
    # Daily at 08:00 UTC.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rehearse:
    name: extract and verify the app-vitals/agent tree
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_ADMIN_TEST: postgres://agent:agent@localhost:5432/agent_admin_test
      DATABASE_URL_SHIPWRIGHT_ADMIN: postgres://agent:agent@localhost:5432/agent_admin_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same pin as ci.yml (Bun 1.4.0 changed process.env.KEY = undefined).
          bun-version: "1.4.3"

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Install source dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium-headless-shell
        run: bunx playwright install --with-deps chromium-headless-shell

      - name: Rehearse extraction
        run: bun scripts/rehearse-extraction.ts
