name: platform-freeze-guard

# AGR-2.4: between the extraction push (AGR-2.3) and the cutover (AGR-4.x) the
# platform code exists in both this repo and app-vitals/agent. Fail any PR that
# touches the frozen paths in platform-manifest.json (include minus excludes
# and composition roots) so the copies cannot drift. The `platform-cutover`
# label bypasses it for the AGR-4.x PRs. Removed by AGR-4.4.
# Logic: scripts/platform-freeze-guard.ts

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  freeze-guard:
    name: Platform paths frozen
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git diff --no-renames --name-only "$BASE_SHA"..."$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          bun scripts/platform-freeze-guard.ts "$RUNNER_TEMP/changed.txt" "$LABELS"
