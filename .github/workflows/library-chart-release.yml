name: Library Chart Release Bump

# Receiver for the library chart release chain (CHM-3.5). When app-vitals/agent
# publishes a new agent-platform library chart version, its chart-release
# workflow dispatches `chart-release` here with the version (CHM-2.7):
#
#   gh api POST repos/app-vitals/shipwright/dispatches \
#     -f event_type=chart-release -f client_payload[version]=$VERSION
#
# This workflow re-pins the agent-platform dependency to that exact version in
# charts/shipwright/Chart.yaml and Chart.lock (lib/library-pin.sh), bumps the
# chart version with the matching artifacthub.io/changes annotation and
# CHANGELOG.md entry, swaps the vendored charts/shipwright/charts/
# agent-platform-*.tgz (same layout CHM-3.1 committed), and opens the bump PR,
# or updates the open one, on the fixed branch chore/library-chart-release. The
# PR's helm.yml checks include the render-parity check. It then reuses the
# platform release merge gate (scripts/platform-bump-gate.sh: waits for CI,
# reruns failed checks, admin-merges the bot PR). The merge touches
# charts/shipwright/**, so chart-release.yml publishes the new chart version
# as usual. Renovate's helmv3 manager is the fallback if a dispatch is missed;
# check-chart-drift.yml fails when the pin trails the published index.
#
# Failures are loud: the job fails (leaving the PR open) and opens (or comments
# on) a "library chart release bump failed" issue; a success closes it.
#
# The version comes from an external event, so it is never interpolated into a
# script: it reaches every step through env and is validated as strict X.Y.Z by
# bump_library_pin before anything is written.
#
# Manual / rehearsal run: Actions -> Library Chart Release Bump -> Run workflow,
# with the library version to pin.
#
# Logic tests: .github/workflows/test-auto-bump-chart.sh (bump) and
# test-check-chart-drift.sh (drift). Content test:
# library-chart-release.content.test.ts (repo root).

on:
  repository_dispatch:
    types: [chart-release]
  workflow_dispatch:
    inputs:
      version:
        description: "agent-platform library chart version to pin (strict X.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: library-chart-release
  cancel-in-progress: false

jobs:
  bump:
    name: bump agent-platform pin and open PR
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open / update the PR
      issues: write # open the failure issue
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      BRANCH: chore/library-chart-release
      LIBRARY_REPO_URL: https://app-vitals.github.io/agent
    steps:
      # DISPATCH_TOKEN (not GITHUB_TOKEN) for checkout and PR: pushes and PRs
      # made with GITHUB_TOKEN do not trigger the PR's CI.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # GitHub Pages lists the new version a short while after the dispatch;
      # poll the index for it before resolving the dependency.
      - name: Wait for the version in the library index
        run: |
          found=false
          for _ in $(seq 1 40); do
            if curl -fsS "${LIBRARY_REPO_URL}/index.yaml" | grep -qx "    version: ${VERSION}"; then
              found=true
              break
            fi
            echo "Waiting for agent-platform ${VERSION} in ${LIBRARY_REPO_URL}/index.yaml..."
            sleep 15
          done
          if [ "$found" != "true" ]; then
            echo "::error::agent-platform ${VERSION} not in ${LIBRARY_REPO_URL}/index.yaml after ~10 minutes" >&2
            exit 1
          fi

      # Validates VERSION (strict X.Y.Z), then rewrites Chart.yaml, Chart.lock,
      # CHANGELOG.md. A no-op when already pinned (or newer).
      - name: Re-pin agent-platform and bump the chart version
        run: |
          source .github/workflows/lib/library-pin.sh
          bump_library_pin charts/shipwright "$VERSION" "$(date -u +%Y-%m-%d)"

      # Refresh the Chart.lock digest and the vendored library tgz the way
      # `helm dependency update` would, but in a scratch copy so the other
      # (exactly pinned) vendored charts are not touched.
      - name: Refresh Chart.lock and the vendored library chart
        run: |
          helm repo add agent "$LIBRARY_REPO_URL"
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add traefik https://traefik.github.io/charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          SCRATCH=$(mktemp -d)
          cp -r charts/shipwright "$SCRATCH/shipwright"
          helm dependency update "$SCRATCH/shipwright"
          cp "$SCRATCH/shipwright/Chart.lock" charts/shipwright/Chart.lock
          if [ -f "$SCRATCH/shipwright/charts/agent-platform-${VERSION}.tgz" ] \
            && [ ! -f "charts/shipwright/charts/agent-platform-${VERSION}.tgz" ]; then
            rm -f charts/shipwright/charts/agent-platform-*.tgz
            cp "$SCRATCH/shipwright/charts/agent-platform-${VERSION}.tgz" charts/shipwright/charts/
          fi
          rm -rf "$SCRATCH"

      - name: Detect changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Already on agent-platform ${VERSION}; no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git checkout -B "$BRANCH"
          git add -A -- charts/shipwright/Chart.yaml charts/shipwright/Chart.lock \
            charts/shipwright/CHANGELOG.md charts/shipwright/charts
          # Anything else changing means the bump did more than re-pin: stop.
          if [ -n "$(git status --porcelain | grep -v '^[MADR] ')" ]; then
            echo "ERROR: unexpected changes outside Chart.yaml/Chart.lock/CHANGELOG.md/charts/:" >&2
            git status --porcelain >&2
            exit 1
          fi
          git commit -m "chore(deps): bump agent-platform library chart to ${VERSION}"
          # One bump branch: a newer release replaces an unmerged older bump.
          git push --force origin "$BRANCH"

      - name: Open or update the bump PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          TITLE="chore(deps): bump agent-platform library chart to ${VERSION}"
          BODY=$(cat <<EOF
          ## agent-platform library chart ${VERSION}

          Re-pins the \`agent-platform\` dependency in \`charts/shipwright/Chart.yaml\` and \`Chart.lock\` to \`${VERSION}\`, replaces the vendored \`charts/agent-platform-*.tgz\` and bumps the chart version (annotation + CHANGELOG in sync).

          Triggered by the \`chart-release\` dispatch from app-vitals/agent (or a manual run).

          ---
          _Auto-generated by \`.github/workflows/library-chart-release.yml\`._
          EOF
          )
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$TITLE" --body "$BODY"
            echo "Updated PR: ${PR_URL}"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --label automated \
              --body "$BODY")
            echo "Opened PR: ${PR_URL}"
          fi
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      # The bot cannot self-approve its PR; the shared gate waits for the CI
      # run on the head commit, reruns failed required checks (up to 3
      # attempts) and admin-merges. A failing or missing check exits 1: the
      # job goes red, the failure step opens an issue, the PR stays open.
      - name: Wait for checks and merge
        id: merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: bash scripts/platform-bump-gate.sh "$PR_URL"

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="library chart release bump failed"
          BODY="The agent-platform library chart bump for version \`${VERSION}\` failed: ${RUN_URL}"
          ISSUE=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close success issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="library chart release bump failed"
          ISSUE=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number -q '.[0].number')
          [ -z "$ISSUE" ] && exit 0
          gh issue comment "$ISSUE" --body "The agent-platform library chart bump for version \`${VERSION}\` succeeded: ${RUN_URL}"
          gh issue close "$ISSUE"
