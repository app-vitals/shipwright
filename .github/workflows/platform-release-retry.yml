name: Platform Release Retry

# XPF-1.1. platform-release.yml admin-merges the bump PR only when its gate
# passes at run time. When the gate went red (e.g. a breaking agent change
# needed a shipwright fix first) the PR was left open and nothing retried it
# after the fix merged (0.16.2 / shipwright#4693). On every push to main this
# looks for an open chore/platform-release PR that is red or conflicting and
# re-dispatches platform-release.yml for the PR's version, at most
# MAX_RETRIES times per PR (scripts/platform-bump-retry.ts; each retry leaves a
# marker comment on the PR). No open bump PR, or a green / still-running one,
# is a no-op. When retries run out this job comments on the PR once
# (an exhausted marker comment stops repeat reports); no issue is opened. While any
# platform-release.yml run is queued or in progress, nothing is retried or
# reported: that bump may be about to fix the PR.
#
# XPF-1.3: an open bump PR that is green on its head commit (fixed by hand or by
# a patch pass after the gate gave up) is merged by running
# scripts/platform-bump-gate.sh on it. It never re-dispatches platform-release
# for a green PR: that force-pushes the branch and would discard the fix
# commits. One attempt per head SHA (a "platform-bump-merge:<sha>" marker
# comment); skipped while a platform-release run is queued or in progress.
#
# XPF-1.4: a red or conflicting PR whose branch holds commits the bump bot did
# not author (a patch pass's or a human's fix) is reported exhausted at once,
# never re-dispatched: the bump would be refused rather than discard them.
#
# Runs in its own concurrency group (runs are serialized, a newer push
# supersedes a queued one). It must not share platform-release's group: a
# queued retry would cancel a pending bump dispatch. The dispatched bump
# serializes itself in that group; an in-flight bump leaves its PR pending,
# which this job treats as a no-op.
# Uses DISPATCH_TOKEN, like platform-release.yml; no other secrets.
#
# Logic tests: scripts/platform-bump-retry.unit.test.ts.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-release-retry
  cancel-in-progress: false

jobs:
  retry:
    name: retry stalled platform bump
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: chore/platform-release
      GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Select retry action
        id: select
        run: |
          gh pr list --head "$BRANCH" --state open \
            --json number,title,url,mergeable,headRefOid,statusCheckRollup > "$RUNNER_TEMP/pr.json"
          NUMBER=$(jq -r '.[0].number // empty' "$RUNNER_TEMP/pr.json")
          USED=0
          MERGE_TRIED=0
          FOREIGN=0
          if [ -n "$NUMBER" ]; then
            # XPF-1.4: non-bot commits on the branch mean a retry would
            # force-push over them; the selector reports such a PR exhausted.
            git fetch origin "$BRANCH"
            # PBF-1.1: the guard protects only an open PR, so pass its url.
            PR_URL=$(jq -r '.[0].url // empty' "$RUNNER_TEMP/pr.json")
            FOREIGN=$(bun scripts/platform-bump-branch-guard.ts origin/main "origin/$BRANCH" "$PR_URL" | sed -n 's/^foreign=//p' || echo 0)
            USED=$(gh pr view "$NUMBER" --json comments \
              -q '[.comments[] | select(.body | contains("<!-- platform-bump-retry -->"))] | length')
            HEAD_SHA=$(jq -r '.[0].headRefOid // empty' "$RUNNER_TEMP/pr.json")
            MERGE_TRIED=$(gh pr view "$NUMBER" --json comments \
              -q "[.comments[] | select(.body | contains(\"<!-- platform-bump-merge:${HEAD_SHA} -->\"))] | length")
          fi
          bun scripts/platform-bump-retry.ts "$RUNNER_TEMP/pr.json" "$USED" "$MERGE_TRIED" "${FOREIGN:-0}" | tee "$RUNNER_TEMP/select.out" >> "$GITHUB_OUTPUT"
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "used=${USED}" >> "$GITHUB_OUTPUT"
          ACTION=$(sed -n 's/^action=//p' "$RUNNER_TEMP/select.out" | tail -n 1)
          # An in-flight or queued bump has not force-pushed yet, so the PR
          # still looks red: retrying (or reporting exhaustion) now would
          # spend budget on a bump that may be about to fix it. Later
          # outputs win over earlier ones in $GITHUB_OUTPUT.
          if [ "$ACTION" = "retry" ] || [ "$ACTION" = "exhausted" ] || [ "$ACTION" = "merge" ]; then
            INFLIGHT=0
            for STATUS in queued in_progress; do
              N=$(gh run list --workflow platform-release.yml --status "$STATUS" \
                --json databaseId -q 'length')
              INFLIGHT=$((INFLIGHT + N))
            done
            if [ "$INFLIGHT" -gt 0 ]; then
              echo "action=wait" >> "$GITHUB_OUTPUT"
              echo "platform-release.yml has ${INFLIGHT} queued/in-progress run(s); skipping"
            fi
          fi
          REPORTED=0
          if [ "$ACTION" = "exhausted" ] && [ -n "$NUMBER" ]; then
            REPORTED=$(gh pr view "$NUMBER" --json comments \
              -q '[.comments[] | select(.body | contains("<!-- platform-bump-exhausted -->"))] | length')
          fi
          echo "reported=${REPORTED}" >> "$GITHUB_OUTPUT"

      - name: Re-dispatch the bump
        if: steps.select.outputs.action == 'retry'
        env:
          VERSION: ${{ steps.select.outputs.version }}
          NUMBER: ${{ steps.select.outputs.number }}
          REASON: ${{ steps.select.outputs.reason }}
          USED: ${{ steps.select.outputs.used }}
        run: |
          gh pr comment "$NUMBER" --body "<!-- platform-bump-retry -->
          Retrying the platform bump for ${VERSION} ($((USED + 1)) of 3): ${REASON}. Triggered by a push to main."
          gh workflow run platform-release.yml --ref main -f version="$VERSION" -f attempt=1

      - name: Merge the green bump
        if: steps.select.outputs.action == 'merge'
        env:
          NUMBER: ${{ steps.select.outputs.number }}
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          PR_URL=$(gh pr view "$NUMBER" --json url -q '.url')
          HEAD_SHA=$(gh pr view "$NUMBER" --json headRefOid -q '.headRefOid')
          gh pr comment "$NUMBER" --body "<!-- platform-bump-merge:${HEAD_SHA} -->
          Platform bump ${VERSION} is green on ${HEAD_SHA}; merging it as-is (no re-dispatch). Triggered by a push to main."
          bash scripts/platform-bump-gate.sh "$PR_URL"

      - name: Report exhausted retries
        if: steps.select.outputs.action == 'exhausted' && steps.select.outputs.reported == '0'
        env:
          NUMBER: ${{ steps.select.outputs.number }}
          VERSION: ${{ steps.select.outputs.version }}
          REASON: ${{ steps.select.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Marker so later pushes to main do not report the same exhaustion again.
          gh pr comment "$NUMBER" --body "<!-- platform-bump-exhausted -->
          Automatic retries are spent for ${VERSION} (${REASON}): ${RUN_URL}. Fix this PR by hand."
