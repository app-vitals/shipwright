name: Platform Release Retry

# XPF-1.1. platform-release.yml admin-merges the bump PR only when its gate
# passes at run time. When the gate went red (e.g. a breaking agent change
# needed a shipwright fix first) the PR was left open and nothing retried it
# after the fix merged (0.16.2 / shipwright#4693). On every push to main this
# looks for an open chore/platform-release PR that is red or conflicting and
# re-dispatches platform-release.yml for the PR's version, at most
# MAX_RETRIES times per PR (scripts/platform-bump-retry.ts; each retry leaves a
# marker comment on the PR). No open bump PR, or a green / still-running one,
# is a no-op. The dispatched run's own failure step opens or refreshes the
# "platform release bump failed" issue; when retries run out this job does it.
#
# Runs in its own concurrency group (runs are serialized, a newer push
# supersedes a queued one). It must not share platform-release's group: a
# queued retry would cancel a pending bump dispatch. The dispatched bump
# serializes itself in that group; an in-flight bump leaves its PR pending,
# which this job treats as a no-op.
# Uses DISPATCH_TOKEN, like platform-release.yml; no other secrets.
#
# Logic tests: scripts/platform-bump-retry.unit.test.ts.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-release-retry
  cancel-in-progress: false

jobs:
  retry:
    name: retry stalled platform bump
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      BRANCH: chore/platform-release
      GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Select retry action
        id: select
        run: |
          gh pr list --head "$BRANCH" --state open \
            --json number,title,mergeable,statusCheckRollup > "$RUNNER_TEMP/pr.json"
          NUMBER=$(jq -r '.[0].number // empty' "$RUNNER_TEMP/pr.json")
          USED=0
          if [ -n "$NUMBER" ]; then
            USED=$(gh pr view "$NUMBER" --json comments \
              -q '[.comments[] | select(.body | contains("<!-- platform-bump-retry -->"))] | length')
          fi
          bun scripts/platform-bump-retry.ts "$RUNNER_TEMP/pr.json" "$USED" | tee -a "$GITHUB_OUTPUT"
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "used=${USED}" >> "$GITHUB_OUTPUT"

      - name: Re-dispatch the bump
        if: steps.select.outputs.action == 'retry'
        env:
          VERSION: ${{ steps.select.outputs.version }}
          NUMBER: ${{ steps.select.outputs.number }}
          REASON: ${{ steps.select.outputs.reason }}
          USED: ${{ steps.select.outputs.used }}
        run: |
          gh pr comment "$NUMBER" --body "<!-- platform-bump-retry -->
          Retrying the platform bump for ${VERSION} ($((USED + 1)) of 3): ${REASON}. Triggered by a push to main."
          gh workflow run platform-release.yml --ref main -f version="$VERSION" -f attempt=1

      - name: Report exhausted retries
        if: steps.select.outputs.action == 'exhausted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.select.outputs.version }}
          REASON: ${{ steps.select.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="platform release bump failed"
          BODY="Platform bump ${VERSION} is still stalled and automatic retries are spent (${REASON}): ${RUN_URL}"
          ISSUE=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
