name: Build Whisper Image

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful upstream-main CI run to publish (recovery after a missed/failed earlier build)
        type: string
        required: true
  pull_request:
    paths:
      - "whisper/**"
      - ".github/workflows/build-whisper.yml"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: whisper-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || inputs.ci_run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test publication guard
        run: python3 -m unittest discover -s whisper -p 'test_*.py'
      - name: Build and verify patched image
        run: |
          docker build --platform linux/amd64 -f whisper/Dockerfile -t shipwright-whisper:ci .
          bash whisper/verify-image.sh shipwright-whisper:ci

  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve trusted CI commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        run: python3 whisper/resolve-ci-run.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Filter image changes
        id: filter
        env:
          RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$RECOVERY" = true ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD -- whisper .github/workflows/build-whisper.yml)
          if [ -n "$changed" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shipwright-whisper:sha-${{ needs.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: Build and verify patched image
        run: |
          docker build --platform linux/amd64 -f whisper/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=${{ needs.changes.outputs.sha }}" \
            -t "$IMAGE" .
          bash whisper/verify-image.sh "$IMAGE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push verified image
        run: docker push "$IMAGE"
