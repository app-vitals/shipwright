name: Platform Release Bump

# Receiver for the platform release chain (AGR-4.1). When app-vitals/agent
# publishes a release, its release workflow dispatches `platform-release` here
# with the version (AGR-3.3):
#
#   gh api POST repos/app-vitals/shipwright/dispatches \
#     -f event_type=platform-release -f client_payload[version]=$VERSION
#
# This workflow re-pins every registry @app-vitals/agent-* dependency to that
# exact version (scripts/platform-release-bump.ts, in every package.json that
# declares one), refreshes bun.lock, and opens the bump PR, or updates the
# open one, on the fixed branch chore/platform-release. Renovate's
# "app-vitals agent platform" group (renovate.json) is the fallback if a
# dispatch is missed.
#
# The same PR refreshes the read-only platform docs snapshot (docs/platform/,
# PLD-2.1): the workflow checks out app-vitals/agent at the release tag and
# scripts/platform-docs-snapshot.ts copies its docs/*.md in with a generated
# source header. platform-docs-guard.yml blocks hand edits to that directory
# from any other PR.
#
# Failures are loud: the job fails, and a failure step opens (or comments on)
# a "platform release bump failed" issue, because a stalled release chain
# otherwise goes unnoticed for days.
#
# The version comes from an external event, so it is never interpolated into
# a script: it reaches every step through env and is validated as strict
# X.Y.Z by the bump script before anything is written.
#
# Manual / rehearsal run: Actions -> Platform Release Bump -> Run workflow,
# with the version to pin.
#
# Logic tests: scripts/platform-release-bump.unit.test.ts. Content test:
# platform-release.content.test.ts (repo root).

on:
  repository_dispatch:
    types: [platform-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Platform version to pin (strict X.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  bump:
    name: bump @app-vitals/agent-* and open PR
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open / update the PR
      issues: write # open the failure issue
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      BRANCH: chore/platform-release
    steps:
      # DISPATCH_TOKEN (not GITHUB_TOKEN) for checkout and PR: pushes and PRs
      # made with GITHUB_TOKEN do not trigger the PR's CI, and an updated
      # bump PR must re-run it. Same token auto-bump-chart.yml opens PRs with.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Validates VERSION (strict X.Y.Z) and rewrites the pins; exits non-zero
      # on an invalid version or when nothing declares a platform package.
      - name: Pin @app-vitals/agent-* to the released version
        run: bun scripts/platform-release-bump.ts "$VERSION"

      - name: Checkout platform repo at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: app-vitals/agent
          token: ${{ secrets.DISPATCH_TOKEN }}
          ref: refs/tags/v${{ env.VERSION }}
          path: .platform-src
          persist-credentials: false

      - name: Refresh the platform docs snapshot
        run: bun scripts/platform-docs-snapshot.ts "$VERSION" .platform-src

      - name: Refresh bun.lock
        run: bun install

      - name: Detect changes
        id: diff
        run: |
          rm -rf .platform-src
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Already on @app-vitals/agent-* ${VERSION}; no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git checkout -B "$BRANCH"
          git add -A -- docs/platform
          git add -u -- bun.lock '*package.json'
          # Anything else changing means the bump did more than re-pin and
          # re-snapshot: stop.
          if [ -n "$(git status --porcelain | grep -v '^[MADR] ')" ]; then
            echo "ERROR: unexpected changes outside package.json/bun.lock/docs/platform:" >&2
            git status --porcelain >&2
            exit 1
          fi
          git commit -m "chore(deps): bump @app-vitals/agent-* to ${VERSION}"
          # One bump branch: a newer release replaces an unmerged older bump.
          git push --force origin "$BRANCH"

      # The PR changes admin/package.json, a platform-frozen path, so it
      # carries the `platform-cutover` label for platform-freeze-guard.yml
      # (removed with the guard in AGR-4.4). It only re-pins versions.
      - name: Open or update the bump PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          TITLE="chore(deps): bump @app-vitals/agent-* to ${VERSION}"
          BODY=$(cat <<EOF
          ## Platform release ${VERSION}

          Re-pins every registry \`@app-vitals/agent-*\` dependency to \`${VERSION}\`, refreshes \`bun.lock\` and refreshes the read-only platform docs snapshot in \`docs/platform/\`.

          Triggered by the \`platform-release\` dispatch from app-vitals/agent (or a manual run).

          ---
          _Auto-generated by \`.github/workflows/platform-release.yml\`._
          EOF
          )
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$TITLE" --body "$BODY"
            echo "Updated PR: ${PR_URL}"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --label automated \
              --label platform-cutover \
              --body "$BODY")
            echo "Opened PR: ${PR_URL}"
          fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="platform release bump failed"
          BODY="The platform release bump for version \`${VERSION}\` failed: ${RUN_URL}"
          ISSUE=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
