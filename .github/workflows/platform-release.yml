name: Platform Release Bump

# Receiver for the platform release chain (AGR-4.1). When app-vitals/agent
# publishes a release, its release workflow dispatches `platform-release` here
# with the version (AGR-3.3):
#
#   gh api POST repos/app-vitals/shipwright/dispatches \
#     -f event_type=platform-release -f client_payload[version]=$VERSION
#
# This workflow re-pins every registry @app-vitals/agent-* dependency to that
# exact version (scripts/platform-release-bump.ts, in every package.json that
# declares one), refreshes bun.lock, and opens the bump PR, or updates the
# open one, on the fixed branch chore/platform-release. It then waits for the
# PR's required checks (rerunning failed ones, up to 3 attempts) and admin-
# merges its own PR (the bot cannot self-approve it). If a required check
# keeps failing, the job fails and the PR is left open. If main moves while
# the bump is being generated, the PR opens CONFLICTING and its required
# checks never run; before waiting on checks the job polls the PR's
# `mergeable` state (until it leaves UNKNOWN) and, on CONFLICTING, logs a
# distinct ::error:: and re-dispatches this workflow once (workflow_dispatch,
# `attempt` input: default 1, cap 2) so the branch is regenerated from fresh
# main. The re-dispatching run exits 0 with a ::warning:: (the PR stays open
# and is force-pushed by the new run, which queues behind this one in the
# non-cancelling concurrency group); a second conflict fails the job loudly
# and the failure issue step fires. Renovate's
# "app-vitals agent platform" group (renovate.json) is the fallback if a
# dispatch is missed.
#
# The same PR refreshes the read-only platform docs snapshot (docs/platform/,
# PLD-2.1): the workflow checks out app-vitals/agent at the release tag and
# scripts/platform-docs-snapshot.ts copies its docs/*.md in with a generated
# source header. platform-docs-guard.yml blocks hand edits to that directory
# from any other PR.
#
# Failures are loud: the job fails (leaving the PR open), and a failure step
# opens (or comments on) a "platform release bump failed" issue, because a
# stalled release chain otherwise goes unnoticed for days.
#
# The version comes from an external event, so it is never interpolated into
# a script: it reaches every step through env and is validated as strict
# X.Y.Z by the bump script before anything is written.
#
# Manual / rehearsal run: Actions -> Platform Release Bump -> Run workflow,
# with the version to pin.
#
# Logic tests: scripts/platform-release-bump.unit.test.ts. Content test:
# platform-release.content.test.ts (repo root).

on:
  repository_dispatch:
    types: [platform-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Platform version to pin (strict X.Y.Z)"
        required: true
        type: string
      attempt:
        description: "Rebuild attempt (1 = first run, 2 = regenerated after a main conflict; capped at 2)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  bump:
    name: bump @app-vitals/agent-* and open PR
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open / update the PR
      issues: write # open the failure issue
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      BRANCH: chore/platform-release
    steps:
      # DISPATCH_TOKEN (not GITHUB_TOKEN) for checkout and PR: pushes and PRs
      # made with GITHUB_TOKEN do not trigger the PR's CI, and an updated
      # bump PR must re-run it. Same token auto-bump-chart.yml opens PRs with.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Validates VERSION (strict X.Y.Z) and rewrites the pins; exits non-zero
      # on an invalid version or when nothing declares a platform package.
      - name: Pin @app-vitals/agent-* to the released version
        run: bun scripts/platform-release-bump.ts "$VERSION"

      - name: Checkout platform repo at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: app-vitals/agent
          token: ${{ secrets.DISPATCH_TOKEN }}
          ref: refs/tags/v${{ env.VERSION }}
          path: .platform-src
          persist-credentials: false

      - name: Refresh the platform docs snapshot
        run: bun scripts/platform-docs-snapshot.ts "$VERSION" .platform-src

      # npm lists a new version a few minutes after the platform publishes it,
      # so `bun install` right after the dispatch failed with "No version
      # matching X found" (0.6.0, 0.6.1, 0.7.0). Poll the registry for every
      # pinned package first; the list comes from the bump script so it cannot
      # drift from what was pinned. VERSION arrives via env only.
      - name: Wait for @app-vitals/agent-* on npm
        run: |
          PACKAGES=$(bun scripts/platform-release-bump.ts --list-packages)
          for pkg in $PACKAGES; do
            found=false
            for _ in $(seq 1 40); do
              if [ "$(npm view "${pkg}@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
                found=true
                break
              fi
              echo "Waiting for ${pkg}@${VERSION} on npm..."
              sleep 15
            done
            if [ "$found" != "true" ]; then
              echo "ERROR: ${pkg}@${VERSION} not available on npm after ~10 minutes" >&2
              exit 1
            fi
            echo "Found ${pkg}@${VERSION}"
          done

      - name: Refresh bun.lock
        run: bun install

      - name: Detect changes
        id: diff
        run: |
          rm -rf .platform-src
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Already on @app-vitals/agent-* ${VERSION}; no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git checkout -B "$BRANCH"
          git add -A -- docs/platform
          git add -u -- bun.lock '*package.json' agent/Dockerfile
          # Anything else changing means the bump did more than re-pin and
          # re-snapshot: stop.
          if [ -n "$(git status --porcelain | grep -v '^[MADR] ')" ]; then
            echo "ERROR: unexpected changes outside package.json/bun.lock/agent/Dockerfile/docs/platform:" >&2
            git status --porcelain >&2
            exit 1
          fi
          git commit -m "chore(deps): bump @app-vitals/agent-* to ${VERSION}"
          # One bump branch: a newer release replaces an unmerged older bump.
          git push --force origin "$BRANCH"

      - name: Open or update the bump PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          TITLE="chore(deps): bump @app-vitals/agent-* to ${VERSION}"
          BODY=$(cat <<EOF
          ## Platform release ${VERSION}

          Re-pins every registry \`@app-vitals/agent-*\` dependency and the \`agent/Dockerfile\` platform image (\`PLATFORM_VERSION\`) to \`${VERSION}\`, refreshes \`bun.lock\` and refreshes the read-only platform docs snapshot in \`docs/platform/\`.

          Triggered by the \`platform-release\` dispatch from app-vitals/agent (or a manual run).

          ---
          _Auto-generated by \`.github/workflows/platform-release.yml\`._
          EOF
          )
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$TITLE" --body "$BODY"
            echo "Updated PR: ${PR_URL}"
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --label automated \
              --body "$BODY")
            echo "Opened PR: ${PR_URL}"
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          fi

      # Required checks must pass before the bump lands, and the bump PR cannot
      # be self-approved (it sits BLOCKED), so the workflow waits for the
      # required checks (rerunning failed ones up to 3 attempts) and
      # admin-merges its own PR. Logic mirrors the "Wait for checks and merge"
      # step in auto-bump-chart.yml and the helpers in
      # .github/workflows/test-auto-bump-chart.sh — keep both copies in sync.
      # A failing required check exits 1: the job goes red, the failure() step
      # below opens an issue, and the PR is left open for a human.
      # The step first waits for the CI workflow run on the PR head commit to
      # complete, so the fast title check cannot stand in for lint / test.
      # Stale-base retry: "Base branch was modified" is a transient GraphQL
      # error when main moves between the checks passing and the merge; retry a
      # few times, never retry any other merge failure.
      - name: Wait for checks and merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          # GitHub computes `mergeable` lazily: UNKNOWN right after the PR is
          # opened or the branch is pushed. Poll until it settles.
          MAX_REBUILD_ATTEMPTS=2
          MERGEABLE=UNKNOWN
          for _ in $(seq 1 30); do
            MERGEABLE=$(gh pr view "$PR_URL" --json mergeable -q .mergeable 2>/dev/null || echo UNKNOWN)
            [ "$MERGEABLE" != "UNKNOWN" ] && break
            sleep 5
          done

          # main moved while the bump was generated: required checks never
          # run on a CONFLICTING PR, so waiting would end in a generic
          # failure. Regenerate the branch from fresh main once (a new run
          # re-pins, re-snapshots and force-pushes), then stop this run.
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::${PR_URL} conflicts with main (mergeable=CONFLICTING); required checks cannot run (attempt ${ATTEMPT}/${MAX_REBUILD_ATTEMPTS})."
            if [ "$ATTEMPT" -lt "$MAX_REBUILD_ATTEMPTS" ]; then
              NEXT_ATTEMPT=$((ATTEMPT + 1))
              gh workflow run platform-release.yml --ref main \
                -f version="$VERSION" \
                -f attempt="$NEXT_ATTEMPT"
              echo "::warning::Re-dispatched platform-release.yml (attempt ${NEXT_ATTEMPT}/${MAX_REBUILD_ATTEMPTS}) to regenerate the bump branch from fresh main; ${PR_URL} stays open and the new run force-pushes it. This run stops here."
              exit 0
            fi
            echo "::error::${PR_URL} still conflicts with main after the attempt ${ATTEMPT}/${MAX_REBUILD_ATTEMPTS} rebuild; giving up, resolve by hand."
            exit 1
          fi

          # The Conventional-Commit PR title check registers within seconds,
          # long before the CI workflow (lint / typecheck / test) exists, so
          # waiting for "a required check" let `gh pr checks --watch
          # --required` see only that one fast check and this job admin-merged
          # a red bump (#4580). Wait for the CI workflow run on the PR head
          # commit to exist and complete first; only then evaluate required
          # checks. A run that never appears within the timeout fails the job
          # without merging.
          HEAD_SHA=$(gh pr view "$PR_URL" --json headRefOid -q '.headRefOid')
          echo "Waiting for the CI workflow run on ${HEAD_SHA}..."
          CI_RUN_ID=""
          for _ in $(seq 1 60); do
            CI_RUN_ID=$(gh run list --commit "$HEAD_SHA" --workflow CI --json databaseId -q '.[0].databaseId // empty' 2>/dev/null || true)
            [ -n "$CI_RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$CI_RUN_ID" ]; then
            echo "ERROR: no CI workflow run appeared for ${HEAD_SHA} on ${PR_URL}; not merging." >&2
            exit 1
          fi
          # The exit status is ignored: failures are evaluated (and failed
          # jobs rerun) by the required-checks loop below.
          gh run watch "$CI_RUN_ID" --interval 15 >/dev/null || true

          # `gh pr checks --watch --required` fails fast with "no required
          # checks reported" if no required check is registered. Once CI has
          # completed they all are; still guard so a missing set never merges.
          echo "Waiting for required checks to register on ${PR_URL}..."
          CHECK_COUNT=0
          for _ in $(seq 1 30); do
            CHECK_COUNT=$(gh pr checks "$PR_URL" --required --json name -q 'length' 2>/dev/null || echo 0)
            [ "$CHECK_COUNT" -gt 0 ] && break
            sleep 2
          done
          if [ "$CHECK_COUNT" -eq 0 ]; then
            echo "ERROR: no required checks registered on ${PR_URL}; not merging." >&2
            exit 1
          fi

          # Extracts the numeric run id from a `gh pr checks --json link`
          # URL, e.g. ".../actions/runs/31518876841/job/93871505296" →
          # "31518876841". Mirrors
          # .github/workflows/test-auto-bump-chart.sh — keep both copies in
          # sync.
          extract_run_id_from_link() {
            local link="$1"
            echo "$link" | sed -n 's#.*/actions/runs/\([0-9]\+\).*#\1#p'
          }

          # Prints the unique set of run ids (one per line) behind every
          # required check whose state is not SUCCESS, from the JSON array
          # produced by `gh pr checks --required --json name,state,link`.
          # `state` values from `gh pr checks --json` are uppercase
          # (SUCCESS, FAILURE, ...). Mirrors
          # .github/workflows/test-auto-bump-chart.sh — keep both copies in
          # sync.
          failed_required_check_run_ids() {
            local checks_json="$1"
            echo "$checks_json" \
              | python3 -c 'import json, sys; data = json.load(sys.stdin); [print(c["link"]) for c in data if c.get("state") != "SUCCESS"]' \
              | while IFS= read -r link; do
                  extract_run_id_from_link "$link"
                done \
              | sort -u
          }

          echo "Waiting for required checks on ${PR_URL}..."
          CHECKS_MAX_ATTEMPTS=3
          for checks_attempt in $(seq 1 "$CHECKS_MAX_ATTEMPTS"); do
            gh pr checks "$PR_URL" --watch --interval 15 --required && break

            echo "Required check(s) failed on attempt ${checks_attempt}/${CHECKS_MAX_ATTEMPTS}." >&2

            if [ "$checks_attempt" -ge "$CHECKS_MAX_ATTEMPTS" ]; then
              echo "ERROR: exhausted ${CHECKS_MAX_ATTEMPTS} attempts waiting for required checks to pass on ${PR_URL}." >&2
              exit 1
            fi

            CHECKS_JSON=$(gh pr checks "$PR_URL" --required --json name,state,link)
            RUN_IDS=$(failed_required_check_run_ids "$CHECKS_JSON")

            if [ -z "$RUN_IDS" ]; then
              echo "No failed required check run ids found to rerun — not retrying." >&2
              exit 1
            fi

            echo "Rerunning failed job(s) behind: $(echo "$RUN_IDS" | paste -sd, -)"
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              gh run rerun "$run_id" --failed
            done <<< "$RUN_IDS"
          done
          echo "Checks passed — merging ${PR_URL}."

          # Detects the transient stale-base GraphQL error (see comment
          # above). Mirrors .github/workflows/test-auto-bump-chart.sh — keep
          # both copies in sync.
          is_stale_base_error() {
            local output="$1"
            if echo "$output" | grep -qi "Base branch was modified"; then
              return 0
            fi
            return 1
          }

          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            MERGE_OUTPUT=$(gh pr merge "$PR_URL" --squash --admin 2>&1) && {
              echo "$MERGE_OUTPUT"
              echo "Merged ${PR_URL}."
              exit 0
            }

            echo "$MERGE_OUTPUT" >&2

            if is_stale_base_error "$MERGE_OUTPUT" && [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Stale-base race detected (attempt ${attempt}/${MAX_ATTEMPTS}) — retrying in 5s..."
              sleep 5
              continue
            fi

            echo "Merge failed on attempt ${attempt}/${MAX_ATTEMPTS} — not retrying (either not a stale-base error, or retries exhausted)."
            exit 1
          done

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="platform release bump failed"
          BODY="The platform release bump for version \`${VERSION}\` failed: ${RUN_URL}"
          ISSUE=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
