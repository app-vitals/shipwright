name: Chart Drift Check

# Periodic drift-check. Image pins are no longer committed: chart-release.yml
# stamps the latest release tag of every service into the chart at publish time
# (ADR 0001). This workflow therefore checks the PUBLISHED chart, not git:
#
#   1. For each service (admin, metrics, agent, task-store, chat) it finds the
#      highest-semver `{service}-v*` git tag (chat: the platform version pinned
#      in agent/Dockerfile) and compares it with the pin inside the newest
#      package on the Pages index. A mismatch means a release did not reach a
#      publish (a skipped or failed chart-release run).
#   2. Every published version newer than 1.32.313 (the last version published
#      before tagging began) must have an annotated `chart-<version>` tag. A
#      missing tag means a publish pushed gh-pages but failed to tag; re-run
#      chart-release.yml (it creates the missing tag without republishing).
#   3. The agent-platform library chart pin (CHM-3.5) in Chart.yaml and
#      Chart.lock must not trail the latest version in the library's Helm repo
#      index (https://app-vitals.github.io/agent).
#
# An unreadable index fails the job too, so a broken check never reads as
# green. The job failure IS the alert; no issue is opened and no secrets are
# used (contents: read only).
#
# Logic lives in .github/workflows/lib/ (chart-tag-utils.sh, chart-drift-check.sh,
# library-pin.sh). Logic tests: .github/workflows/test-check-chart-drift.sh.
# Run locally: bash .github/workflows/test-check-chart-drift.sh

on:
  schedule:
    # Daily at 09:00 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PAGES_URL: https://app-vitals.github.io/shipwright
  # Last chart version published before chart-<version> tags began (RCN-9.10).
  CHART_TAG_FLOOR: 1.32.313

jobs:
  check-drift:
    name: check published chart against latest release tags
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compare the published chart's pins against latest release tags
        run: |
          set -uo pipefail

          source .github/workflows/lib/chart-tag-utils.sh
          source .github/workflows/lib/chart-drift-check.sh

          WORK=$(mktemp -d)
          if ! curl -fsS --retry 3 --retry-delay 5 -o "$WORK/index.yaml" "${PAGES_URL}/index.yaml"; then
            echo "::error::could not fetch ${PAGES_URL}/index.yaml; the published chart pins were NOT checked."
            exit 1
          fi
          LATEST_CHART=$(latest_chart_version "$WORK/index.yaml")
          if [ -z "$LATEST_CHART" ]; then
            echo "::error::no shipwright chart versions in ${PAGES_URL}/index.yaml."
            exit 1
          fi
          if ! curl -fsS --retry 3 --retry-delay 5 -o "$WORK/chart.tgz" "${PAGES_URL}/shipwright-${LATEST_CHART}.tgz" \
            || ! tar -xzf "$WORK/chart.tgz" -C "$WORK" shipwright/values.yaml; then
            echo "::error::could not fetch or unpack ${PAGES_URL}/shipwright-${LATEST_CHART}.tgz."
            exit 1
          fi
          VALUES_YAML="$WORK/shipwright/values.yaml"
          echo "Checking the pins stamped into published chart ${LATEST_CHART}."

          SERVICES=(admin metrics agent task-store chat)
          LATEST_BY_SERVICE=""
          MISSING_SERVICES=()
          for service in "${SERVICES[@]}"; do
            LATEST=$(latest_tag_for_service "$service")
            if [ -z "$LATEST" ]; then
              MISSING_SERVICES+=("$service")
              continue
            fi
            LATEST_BY_SERVICE="${LATEST_BY_SERVICE}${service}=${LATEST}
          "
          done

          if [ ${#MISSING_SERVICES[@]} -gt 0 ]; then
            echo "No git tags found for: ${MISSING_SERVICES[*]}; skipping drift check for these services (nothing to compare against)."
          fi

          echo "Latest release tag per service:"
          echo "$LATEST_BY_SERVICE"

          MISMATCHES=$(compute_drift "$VALUES_YAML" "$LATEST_BY_SERVICE")

          if [ -n "$MISMATCHES" ]; then
            echo ""
            echo "Chart drift detected: published chart ${LATEST_CHART} is not pinned to the latest release tag(s):"
            echo "$MISMATCHES"
            echo ""
            echo "::error title=Published chart is stale::a release did not reach a chart publish. Re-run 'Chart Release' (workflow_dispatch) to publish a chart stamped with the latest tags."
            exit 1
          fi

          echo ""
          echo "No chart drift detected: all published pins match their latest release tags."

      # chart-release.yml tags every publish chart-<version> after the gh-pages
      # push. A published version without a tag means tagging failed.
      - name: Check every published chart version has a chart tag
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          source .github/workflows/lib/chart-drift-check.sh

          INDEX=$(mktemp)
          if ! curl -fsS --retry 3 --retry-delay 5 -o "$INDEX" "${PAGES_URL}/index.yaml"; then
            echo "::error::could not fetch ${PAGES_URL}/index.yaml; chart tags were NOT checked."
            exit 1
          fi
          MISSING=$(versions_missing_chart_tag "$INDEX" "$CHART_TAG_FLOOR") || exit 1
          if [ -n "$MISSING" ]; then
            echo "Published chart versions with no chart-<version> tag:"
            echo "$MISSING"
            echo "::error title=Chart tag missing::a publish pushed gh-pages but did not create its chart-<version> tag. Re-run 'Chart Release' (workflow_dispatch); it creates the missing tag without republishing."
            exit 1
          fi
          echo "Every published chart version since ${CHART_TAG_FLOOR} has a chart-<version> tag."

      # The library pin (agent-platform) is bumped by library-chart-release.yml
      # on the library's chart-release dispatch. A pin behind the published
      # index means a dispatch was missed or its bump PR is stuck.
      - name: Compare the library chart pin against the published index
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          source .github/workflows/lib/library-pin.sh

          INDEX=$(mktemp)
          if ! curl -fsS --retry 3 --retry-delay 5 -o "$INDEX" https://app-vitals.github.io/agent/index.yaml; then
            echo "::error::could not fetch https://app-vitals.github.io/agent/index.yaml; the library chart pin was NOT checked."
            exit 1
          fi

          MISMATCHES=$(compute_library_drift charts/shipwright/Chart.yaml charts/shipwright/Chart.lock "$INDEX") || exit 1
          LATEST=$(latest_library_version "$INDEX")
          echo "Latest published agent-platform: ${LATEST}; pinned in Chart.yaml: $(library_pin_from_chart charts/shipwright/Chart.yaml), Chart.lock: $(library_pin_from_lock charts/shipwright/Chart.lock)"

          if [ -n "$MISMATCHES" ]; then
            echo "$MISMATCHES"
            echo "::error title=Library chart pin is stale::agent-platform is behind the latest published version ${LATEST}. A chart-release dispatch was missed or the bump PR (chore/library-chart-release) is stuck: re-run 'Library Chart Release Bump' with version ${LATEST}."
            exit 1
          fi
          echo "Library chart pin is current."
