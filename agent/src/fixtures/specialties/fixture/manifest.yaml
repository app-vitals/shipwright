# Minimal fixture specialty (AGR-1.9). Platform tests point
# SHIPWRIGHT_SPECIALTIES_DIR at the parent of this directory and
# SHIPWRIGHT_DEFAULT_AGENT_TYPE at "fixture", so the platform test suite needs
# no coding specialty. It is test data, not a product specialty: no crons, no
# plugins, no GitHub scope.
apiVersion: shipwright.dev/v1alpha1
kind: Specialty
metadata:
  name: fixture
  displayName: Fixture Agent
  description: Minimal specialty used by the platform test suite.
  version: 1.0.0
  skills: []
identity:
  # Resolved against the repo root first, then against this manifest's own directory.
  templatesDir: templates/
crons: []
plugins:
  - fixture-plugin
tools:
  - Bash
  - WebSearch
env:
  required:
    - key: CLAUDE_CODE_OAUTH_TOKEN
      description: Claude Code OAuth token used to authenticate the agent's Claude sessions.
      secret: true
  optional:
    - key: GH_TOKEN
      description: GitHub Personal Access Token.
      secret: true
members: []
repos: []
chat: true
voice: true
