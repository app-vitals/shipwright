# Root Bun config.
#
# The site/ subproject is a self-contained Astro project with its own
# Playwright smoke tests named *.spec.ts (Playwright convention). Bun's test
# runner would otherwise discover those *.spec.ts files and fail trying to run
# them with the Bun runner. Exclude site/ from the root `bun test` scan so the
# Astro site stays fully isolated from the monorepo test suite.
#
# metrics/e2e/ and admin/e2e/ contain Playwright *.e2e.ts tests that must be
# run via `bunx playwright test` — not via bun test. Exclude them so Bun does
# not try to execute Playwright test files with the Bun runner.
#
# *.canary.test.ts is a reserved suffix (no files use it yet) for the future
# canary suite defined by the canary-execution skill contract
# (plugins/shipwright/skills/canary-execution/SKILL.md). Canary tests run via
# a dedicated entry point, never via default `bun test` — same rationale as
# the e2e exclusions above, added proactively to prevent a future collision.
# See docs/test-readiness/naming.md for the full naming + exclusion reference.
#
# preload runs scripts/test-env-preload.ts before any test file loads,
# forcing NODE_ENV=test for every `bun test` invocation whose cwd is the
# repo root (root suite, single-file runs from root). Bun does not apply a
# root bunfig.toml's preload to a `bun test` run whose cwd is a subpackage
# directory — those scripts (mcp-server, task-store, agent, metrics, admin,
# plugins/shipwright, chat) carry their own explicit NODE_ENV=test prefix as
# a second guard until Bun supports preload inheritance for nested/filtered
# runs. See docs/observability.md for why this matters (Sentry test guard).
[test]
pathIgnorePatterns = ["**/site/**", "**/metrics/e2e/**", "**/admin/e2e/**", "**/*.canary.test.ts"]
preload = ["./scripts/test-env-preload.ts"]
