version: "3"

tasks:
  setup:
    desc: Install all dependencies
    cmds:
      - bun install

  lint:
    desc: Run linter across all packages
    cmds:
      - bunx biome lint .

  format:
    desc: Run formatter across all packages
    cmds:
      - bunx biome format --write .

  typecheck:
    desc: Type-check all packages
    cmds:
      - bun run --filter="*" --sequential typecheck

  test:
    desc: Run all tests
    cmds:
      - bun test

  test:coverage:
    desc: Run all tests with coverage, then gate on aggregate 89/89 lines/functions (scripts/check-coverage.ts)
    cmds:
      - bun test --coverage --coverage-reporter=lcov
      - bun run scripts/check-coverage.ts

  check-strings:
    desc: Scan entire repo for banned strings (confidential identifiers, client names)
    cmds:
      - bun plugins/shipwright/scripts/check-banned-strings.ts

  check-config-docs:
    desc: Verify all process.env.* vars in agent/src/ and plugins/shipwright/scripts/ are documented in docs/configuration.md
    cmds:
      - bun scripts/check-config-docs.ts

  check-version-sync:
    desc: Assert version.txt matches plugin.json and all package.json files
    cmds:
      - bun run scripts/sync-version.ts --check

  ci:
    desc: Run all CI checks (lint → check-strings → typecheck → check-config-docs → check-version-sync → test:coverage → secret-scan)
    cmds:
      - task: lint
      - task: check-strings
      - task: typecheck
      - task: check-config-docs
      - task: check-version-sync
      - task: test:coverage
      - task: secret-scan

  api:
    desc: Start the metrics dashboard in offline mode → http://localhost:3460/dashboard
    env:
      METRICS_OFFLINE: "true"
    cmds:
      - bun metrics/src/server.ts

  ui:
    desc: Start the metrics dashboard in offline mode (alias for task api) → http://localhost:3460/dashboard
    env:
      METRICS_OFFLINE: "true"
    cmds:
      - bun metrics/src/server.ts

  dev:
    desc: Dev supervisor — starts metrics in offline mode; Ctrl-C kills all children → http://localhost:3460/dashboard
    cmds:
      - bun scripts/dev.ts

  hitl:
    desc: "Human-in-the-loop runner: boots task-store (:3002) + admin (:3001), then loops — pulls the next ready task and launches Claude Code with the right command. Uses localhost as hostname (set SHIPWRIGHT_HITL_HOST to override)."
    cmds:
      - bun scripts/hitl.ts

  stack:
    aliases: [stack:up]
    desc: Launch the full dev stack in a tmux session (6 panes — metrics :3460, admin :3001, task-store :3002, chat-svc :3003, agent, logs). Chat with the agent at http://localhost:3001/admin/chat. Requires tmux; falls back to `task dev`.
    cmds:
      - bun scripts/dev-tmux.ts

  stack:down:
    desc: Tear down the dev stack — kill the tmux session and stop/remove the agent Docker container (which `tmux kill-session` alone leaves running).
    cmds:
      - bun scripts/dev-tmux.ts --down

  db:provision:
    desc: Create the admin database (idempotent — safe to re-run)
    cmds:
      - |
        if [ -z "$DATABASE_URL_SHIPWRIGHT_ADMIN" ]; then
          echo "ERROR: DATABASE_URL_SHIPWRIGHT_ADMIN is not set. Export it before running db:provision."
          exit 1
        fi
        cd admin && bunx prisma migrate deploy --schema=prisma/schema.prisma

  db:migrate:
    desc: Generate and apply a new Prisma migration (dev only)
    cmds:
      - |
        if [ -z "$DATABASE_URL_SHIPWRIGHT_ADMIN" ]; then
          echo "ERROR: DATABASE_URL_SHIPWRIGHT_ADMIN is not set. Export it before running db:migrate."
          exit 1
        fi
        cd admin && bunx prisma migrate dev --schema=prisma/schema.prisma

  db:provision:task-store:
    desc: Create the task-store database (idempotent — safe to re-run)
    cmds:
      - |
        if [ -z "$DATABASE_URL_SHIPWRIGHT_TASK_STORE" ]; then
          echo "ERROR: DATABASE_URL_SHIPWRIGHT_TASK_STORE is not set. Export it before running db:provision:task-store."
          exit 1
        fi
        cd task-store && bunx prisma migrate deploy --schema=prisma/schema.prisma

  db:migrate:task-store:
    desc: Generate and apply a new task-store Prisma migration (dev only)
    cmds:
      - |
        if [ -z "$DATABASE_URL_SHIPWRIGHT_TASK_STORE" ]; then
          echo "ERROR: DATABASE_URL_SHIPWRIGHT_TASK_STORE is not set. Export it before running db:migrate:task-store."
          exit 1
        fi
        cd task-store && bunx prisma migrate dev --schema=prisma/schema.prisma


  e2e:
    desc: Run metrics dashboard Playwright e2e tests (requires Playwright chromium installed)
    cmds:
      - cd metrics && bunx playwright test

  e2e:admin:
    desc: Run admin UI Playwright e2e tests (requires Playwright chromium installed)
    cmds:
      - cd admin && bunx playwright test

  secret-scan:
    desc: Scan for accidentally committed secrets (gitleaks)
    cmds:
      - |
        if command -v gitleaks &>/dev/null; then
          gitleaks detect --source . --no-git --redact
        else
          echo "WARNING: gitleaks not installed locally — skipping secret scan. CI enforces this gate."
        fi

  helm:lint:
    desc: "Helm chart lint (helm lint charts/shipwright)"
    cmds:
      - helm lint charts/shipwright

  helm:unittest:
    desc: "Helm unit tests (helm-unittest golden specs under charts/shipwright/tests/)"
    cmds:
      - helm unittest charts/shipwright

  helm:validate:
    desc: "Render templates and validate against k8s + CRD schemas (kubeconform, strict)"
    cmds:
      # The CRD schema-location uses kubeconform's own {{.Group}} placeholders;
      # wrap the whole flag in a go-task string literal so go-task does not try
      # to interpolate those braces.
      - >-
        helm template shipwright charts/shipwright --namespace shipwright
        | kubeconform -strict -summary
        -schema-location default
        {{ printf "%s" "-schema-location" }}
        {{ printf "%s" "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" }}
      # Traefik profile: exercises the traefik dialect (ingress.yaml) plus the
      # Middleware/http-redirect templates against the traefik.io/v1alpha1
      # Middleware CRD schema (same datreeio CRDs-catalog schema-location
      # above already resolves it). Traefik's own CRDs (IngressRoute,
      # Middleware, etc.) ship in the subchart's special crds/ directory, which
      # `helm template` never renders — so no CustomResourceDefinition
      # documents appear here and no -skip flag is needed.
      - >-
        helm template shipwright charts/shipwright --namespace shipwright
        -f charts/shipwright/examples/values-cloud-native-traefik.yaml
        | kubeconform -strict -summary
        -schema-location default
        {{ printf "%s" "-schema-location" }}
        {{ printf "%s" "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" }}
      # Cloud-native nginx+cert-manager profile (CNH-8.1): unlike the traefik
      # profile above, cert-manager ships its CRDs as regular templates
      # (templates/crd-*.yaml, gated on crds.enabled), so `helm template`
      # output here DOES contain real CustomResourceDefinition documents — the
      # CRD *definitions* themselves, not CR instances. kubeconform's default
      # schema catalog chokes validating those definition bodies, so
      # -skip CustomResourceDefinition excludes just those documents; every
      # other rendered object (the chart-managed Issuer's bootstrap ConfigMap,
      # Deployments, etc.) is still fully validated.
      - >-
        helm template shipwright charts/shipwright --namespace shipwright
        -f charts/shipwright/examples/values-cloud-native.yaml
        | kubeconform -strict -summary
        -skip CustomResourceDefinition
        -schema-location default
        {{ printf "%s" "-schema-location" }}
        {{ printf "%s" "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" }}

  helm:check:
    desc: "Local-runnable Helm gate: lint → unittest → validate (no cluster)"
    cmds:
      - task: helm:lint
      - task: helm:unittest
      - task: helm:validate

  helm:e2e:
    desc: "Helm end-to-end: ct install on a kind cluster (runs `helm test`). Requires kind + ct + a running Docker daemon."
    cmds:
      - ct install --config ct.yaml --charts charts/shipwright

  minikube:up:
    desc: "Bring the FULL Shipwright stack up on Minikube (admin + metrics + task-store + chat + PostgreSQL + agent provisioning). Requires minikube + helm + kubectl."
    cmds:
      - bun run scripts/minikube.ts

  minikube:down:
    desc: "Tear down the Minikube stack: helm uninstall, then minikube delete."
    cmds:
      - bun run scripts/minikube.ts --down

  pre-public:
    desc: Full pre-public audit gate (check-strings + secret-scan). Run before making the repo public.
    cmds:
      - task: check-strings
      - task: secret-scan

